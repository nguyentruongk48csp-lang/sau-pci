<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d6e6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sau PCI">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Quản lý bệnh nhân sau PCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: input rail left, recommendation board right (ESC | ACC/AHA side by side) */
  --bg:#f3f5f7; --surface:#ffffff; --ink:#152033; --muted:#5b6678; --line:#dde2e8; --accent:#0d6e6e; --accent-soft:#e2f1f0;
  --esc:#1f4f9c; --esc-soft:#e6eefb; --aha:#b4232f; --aha-soft:#fbe9ea;
  --ok:#1d7a46; --ok-soft:#e3f3e9; --warn:#a86207; --warn-soft:#fdf1df; --bad:#b42318; --bad-soft:#fde8e6; --info:#6b7686; --info-soft:#eef1f4;
  --c1:#1d7a46; --c2a:#5f8a12; --c2b:#b07a09; --c3:#b42318;
  --font:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#171e27; --ink:#e7ecf2; --muted:#9aa6b6; --line:#2a3440; --accent:#4fb7b2; --accent-soft:#16302f;
    --esc:#7fa8ec; --esc-soft:#18263d; --aha:#f08a91; --aha-soft:#3a1c20;
    --ok:#5fcf8d; --ok-soft:#14301f; --warn:#f1b24a; --warn-soft:#352612; --bad:#ff8a7f; --bad-soft:#3b1a17; --info:#9aa6b6; --info-soft:#1f2832;
    --c1:#5fcf8d; --c2a:#a9d65a; --c2b:#f1b24a; --c3:#ff8a7f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --ink:#e7ecf2; --muted:#9aa6b6; --line:#2a3440; --accent:#4fb7b2; --accent-soft:#16302f;
  --esc:#7fa8ec; --esc-soft:#18263d; --aha:#f08a91; --aha-soft:#3a1c20;
  --ok:#5fcf8d; --ok-soft:#14301f; --warn:#f1b24a; --warn-soft:#352612; --bad:#ff8a7f; --bad-soft:#3b1a17; --info:#9aa6b6; --info-soft:#1f2832;
  --c1:#5fcf8d; --c2a:#a9d65a; --c2b:#f1b24a; --c3:#ff8a7f;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; font-variant-numeric:tabular-nums;}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
header.top{position:relative; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between}
.brand h1{font-size:18px; margin:0; font-weight:700; letter-spacing:-.01em; text-wrap:balance}
.brand p{margin:0; color:var(--muted); font-size:12.5px}
.tools{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--bg)}
.seg button{border:0; background:transparent; padding:6px 12px; cursor:pointer; font-size:13px; font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
main{display:grid; grid-template-columns: minmax(330px, 420px) 1fr; gap:16px; padding:16px; max-width:1500px; margin:0 auto}
@media (max-width: 980px){ main{grid-template-columns:1fr} }
@media (min-width: 981px){ header.top{position:sticky; top:0} }
.rail{display:flex; flex-direction:column; gap:10px}
@media (min-width: 981px){ .rail{position:sticky; top:72px; max-height:calc(100vh - 88px); overflow:auto; padding-right:4px} }
details.sec{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
details.sec > summary{list-style:none; cursor:pointer; padding:10px 14px; font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:8px}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .sum{font-weight:400; color:var(--muted); font-size:12.5px; text-align:right}
details.sec > summary::after{content:"▾"; color:var(--muted); font-size:12px}
details.sec:not([open]) > summary::after{content:"▸"}
.secbody{padding:2px 14px 14px; display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--line)}
.field{display:flex; flex-direction:column; gap:6px; padding-top:10px}
.field > label, .field > .lab{font-size:12.5px; color:var(--muted); font-weight:500}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:5px 11px; font-size:13px; cursor:pointer; line-height:1.3; text-align:left}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}
.row{display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); gap:8px}
.inp{display:flex; flex-direction:column; gap:4px}
.inp span{font-size:12px; color:var(--muted)}
.inp input, .inp select{border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:7px 9px; width:100%}
.hint{font-size:12px; color:var(--muted); margin:0}
.calc{font-size:12.5px; background:var(--accent-soft); border-radius:8px; padding:6px 9px}
.board{display:flex; flex-direction:column; gap:14px; min-width:0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px}
.card h2{font-size:16px; margin:0 0 10px; text-wrap:balance}
.card h3{font-size:14px; margin:14px 0 8px}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
.tile{border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--bg)}
.tile .k{font-size:12px; color:var(--muted); font-weight:600}
.tile .v{font-size:18px; font-weight:700}
.tile .s{font-size:12px; color:var(--muted)}
.pill{display:inline-block; border-radius:999px; padding:1px 8px; font-size:12px; font-weight:600}
.p-ok{background:var(--ok-soft); color:var(--ok)} .p-warn{background:var(--warn-soft); color:var(--warn)} .p-bad{background:var(--bad-soft); color:var(--bad)} .p-info{background:var(--info-soft); color:var(--info)}
table.tg{width:100%; border-collapse:collapse; font-size:13.5px}
table.tg th, table.tg td{border-bottom:1px solid var(--line); padding:7px 6px; text-align:left; vertical-align:top}
table.tg th{font-size:12px; color:var(--muted); font-weight:600}
.tablewrap{overflow-x:auto}
.warns{display:flex; flex-direction:column; gap:6px; margin:0; padding:0; list-style:none}
.warns li{border-left:4px solid var(--warn); background:var(--warn-soft); padding:7px 10px; border-radius:6px; font-size:13.5px}
.warns li.no{border-color:var(--bad); background:var(--bad-soft)}
.warns li .refs{display:block; font-size:12px; color:var(--muted); margin-top:2px}
.tabs{display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:0}
.tab{border:0; background:transparent; padding:8px 12px; cursor:pointer; font-weight:600; font-size:13.5px; color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tab .n{font-weight:500; font-size:11.5px; color:var(--muted); margin-left:4px}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px}
.cols.one{grid-template-columns:1fr}
@media (max-width: 760px){ .cols{grid-template-columns:1fr} }
.colhead{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; padding:6px 10px; border-radius:8px}
.colhead.esc{background:var(--esc-soft); color:var(--esc)} .colhead.aha{background:var(--aha-soft); color:var(--aha)}
.recs{display:flex; flex-direction:column; gap:8px; margin-top:8px}
.rec{border:1px solid var(--line); border-left-width:5px; border-radius:8px; padding:8px 10px; background:var(--surface)}
.rec.do{border-left-color:var(--ok)} .rec.opt{border-left-color:var(--c2b)} .rec.no{border-left-color:var(--bad)} .rec.info{border-left-color:var(--line); opacity:.86}
.rec .bd{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:4px}
.soc{font-size:11px; font-weight:700; border-radius:4px; padding:1px 6px; color:#fff}
.soc.esc{background:var(--esc)} .soc.aha{background:var(--aha)}
.cor{font-size:12px; font-weight:700; border-radius:4px; padding:1px 7px; border:1.5px solid currentColor}
.cor.c1{color:var(--c1)} .cor.c2a{color:var(--c2a)} .cor.c2b{color:var(--c2b)} .cor.c3{color:var(--c3)}
.loe{font-size:12px; font-weight:600; color:var(--muted)}
.st{font-size:11.5px; font-weight:600; margin-left:auto}
.st.do{color:var(--ok)} .st.opt{color:var(--c2b)} .st.no{color:var(--bad)} .st.info{color:var(--muted)}
.rec p{margin:0; font-size:13.5px}
.rec .src{font-size:11.5px; color:var(--muted); margin-top:3px}
.rec .why{font-size:12px; color:var(--accent); font-weight:500}
.note{font-size:13px; background:var(--info-soft); border-radius:8px; padding:8px 10px; margin:8px 0 0}
.tl{display:flex; flex-direction:column; gap:8px; margin-top:6px}
.lane{display:grid; grid-template-columns:70px 1fr; align-items:center; gap:8px}
.lane .ln{font-size:12px; font-weight:700}
.track{position:relative; height:38px; background:var(--bg); border:1px solid var(--line); border-radius:6px; overflow:hidden}
.seg2{position:absolute; top:0; bottom:0; display:flex; align-items:center; padding:0 6px; font-size:11.5px; font-weight:600; overflow:hidden; border-right:2px solid var(--surface); line-height:1.15}
.seg2.tri{background:#c2410c33} .seg2.dapt{background:#0d6e6e33} .seg2.dual{background:#6d28d933} .seg2.sapt{background:#2563eb26} .seg2.oac{background:#64748b33}
.marker{position:absolute; top:-2px; bottom:-2px; width:3px; background:var(--ink); border-radius:2px}
.ticks{position:relative; height:16px; margin-left:78px; font-size:11px; color:var(--muted)}
.ticks span{position:absolute; transform:translateX(-50%); white-space:nowrap}
.legend{display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--muted)}
.legend b{font-weight:600}
.small{font-size:12.5px; color:var(--muted)}
ul.plain{margin:6px 0 0; padding-left:18px; font-size:13.5px}
.disc{font-size:12px; color:var(--muted); border-top:1px dashed var(--line); padding-top:8px; margin-top:10px}
.jump{position:fixed; right:14px; bottom:14px; z-index:30; display:none}
@media (max-width: 980px){ .jump{display:inline-block} }
.toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:8px 14px; border-radius:999px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:40}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
.srcs li{margin-bottom:6px; font-size:13px}
#printArea{display:none}
#pdfsrc{position:fixed; left:-12000px; top:0; width:704px; background:#fff}
.pv{position:fixed; inset:0; z-index:50; background:rgba(20,28,32,.72); display:flex; flex-direction:column}
.pv[hidden]{display:none}
.pvbar{display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--line)}
.pvbar b{flex:1; font-size:15px}
.pvbar .pvinfo{color:var(--muted); font-size:12.5px; font-weight:400; margin-left:6px}
.pvbody{flex:1; overflow:auto; padding:18px 10px 40px; display:flex; flex-direction:column; align-items:center; gap:14px}
.pvbody img{width:100%; max-width:794px; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.35); border-radius:2px}
.pvbody .pvmsg{color:#fff; margin-top:40px; font-size:14px}
.dsub{font-size:13.5px; margin:10px 0 4px; color:var(--muted)}
.dgrp{margin-top:14px; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--surface)}
.dgrp.rel{border-left:5px solid var(--accent)}
.dgrp h3{margin:0 0 8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.dgrp.dim{opacity:.72}
.gsec{margin-top:14px}
.gsec h3{display:flex; align-items:center; gap:8px; margin:0 0 8px}
.gsec h3 .tag{font-size:11.5px; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent)}
.glist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.glist li{border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:var(--surface)}
.gsec.now .glist li{border-left:5px solid var(--ok)}
.gsec.next .glist li{border-left:5px solid var(--esc)}
.glist p{margin:0 0 5px; font-size:14px}
.refs2{display:flex; flex-wrap:wrap; gap:5px}
.rb{font-size:11.5px; font-weight:600; border-radius:4px; padding:1px 6px; border:1px solid currentColor; white-space:nowrap}
.rb.esc{color:var(--esc)} .rb.aha{color:var(--aha)} .rb.tbl{color:var(--muted); font-weight:500}
@media print{
  body{background:#fff}
  header.top, main, .jump, .toast{display:none !important}
  #printArea{display:block}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Quản lý bệnh nhân sau PCI</h1>
    <p>Khuyến cáo ESC và ACC/AHA song song · mức khuyến cáo (COR) và mức bằng chứng (LOE)</p>
  </div>
  <div class="tools">
    <button type="button" class="btn" id="reset">Làm mới</button>
    <button type="button" class="btn primary" id="print">In kết quả</button>
  </div>
</header>
<main>
  <aside class="rail" id="rail" aria-label="Đặc điểm bệnh nhân"></aside>
  <section class="board" id="board" aria-live="polite"></section>
</main>
<a href="#board" class="btn primary jump" id="jump">Xem khuyến cáo ↓</a>
<div class="toast" id="toast" role="status"></div>
<div id="printArea" aria-hidden="true"></div>
<div id="pdfsrc" aria-hidden="true"></div>
<div class="pv" id="pv" hidden role="dialog" aria-modal="true" aria-labelledby="pvt">
  <div class="pvbar"><b id="pvt">Xem trước PDF<span class="pvinfo" id="pvinfo"></span></b>
    <button type="button" class="btn" id="pvclose">Đóng</button>
    <button type="button" class="btn primary" id="pvsave" disabled>Lưu PDF</button></div>
  <div class="pvbody" id="pvbody"></div>
</div>
<script>
/* ===== ENGINE: pure functions, no DOM ===== */
var GL = {
  'ESC-ACS23': {s:'ESC', n:'ESC 2023 – Hội chứng vành cấp', c:'Byrne RA, et al. 2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J 2023;44:3720–3826.'},
  'ESC-CCS24': {s:'ESC', n:'ESC 2024 – Hội chứng vành mạn', c:'Vrints C, et al. 2024 ESC Guidelines for the management of chronic coronary syndromes. Eur Heart J 2024;45:3415–3537.'},
  'ESC-AF24':  {s:'ESC', n:'ESC 2024 – Rung nhĩ', c:'Van Gelder IC, et al. 2024 ESC Guidelines for the management of atrial fibrillation (EACTS). Eur Heart J 2024;45:3314–3414.'},
  'ESC-HTN24': {s:'ESC', n:'ESC 2024 – Tăng huyết áp', c:'McEvoy JW, et al. 2024 ESC Guidelines for the management of elevated blood pressure and hypertension. Eur Heart J 2024;45:3912–4018.'},
  'ESC-LIP25': {s:'ESC', n:'ESC/EAS 2025 – Rối loạn lipid (cập nhật)', c:'Mach F, et al. 2025 Focused Update of the 2019 ESC/EAS Guidelines for the management of dyslipidaemias. Eur Heart J 2025.'},
  'ESC-CKD26': {s:'ESC', n:'ESC/ERA 2026 – Bệnh tim mạch & bệnh thận mạn', c:'Damman K, Herrington WG, et al. 2026 ESC Guidelines for the management of cardiovascular disease and chronic kidney disease (ERA). Eur Heart J 2026; doi:10.1093/eurheartj/ehag098.'},
  'ESC-HF26':  {s:'ESC', n:'ESC 2026 – Suy tim', c:'2026 ESC Guidelines for the management of heart failure. Eur Heart J 2026; doi:10.1093/eurheartj/ehag100.'},
  'ESC-DM23':  {s:'ESC', n:'ESC 2023 – Bệnh tim mạch ở BN đái tháo đường (nguồn bổ sung)', c:'Marx N, Federici M, et al. 2023 ESC Guidelines for the management of cardiovascular disease in patients with diabetes. Eur Heart J 2023;44:4043–4140. (Nguồn ngoài 12 tài liệu được cung cấp.)'},
  'AHA-ACS25': {s:'AHA', n:'ACC/AHA 2025 – Hội chứng vành cấp', c:'Rao SV, et al. 2025 ACC/AHA/ACEP/NAEMSP/SCAI Guideline for the Management of Patients With Acute Coronary Syndromes. J Am Coll Cardiol 2025.'},
  'AHA-CCD23': {s:'AHA', n:'AHA/ACC 2023 – Bệnh mạch vành mạn', c:'Virani SS, et al. 2023 AHA/ACC/ACCP/ASPC/NLA/PCNA Guideline for the Management of Patients With Chronic Coronary Disease. J Am Coll Cardiol 2023;82:833–955.'},
  'AHA-HTN25': {s:'AHA', n:'AHA/ACC 2025 – Tăng huyết áp', c:'Jones DW, et al. 2025 AHA/ACC/AANP/AAPA/ABC/ACCP/ACPM/AGS/AMA/ASPC/NMA/PCNA/SGIM Guideline for the Prevention, Detection, Evaluation and Management of High Blood Pressure in Adults. J Am Coll Cardiol 2025.'},
  'AHA-LIP26': {s:'AHA', n:'ACC/AHA 2026 – Rối loạn lipid máu', c:'Blumenthal RS, et al. 2026 ACC/AHA Multisociety Guideline on the Management of Dyslipidemia. J Am Coll Cardiol 2026;87:2624–2757.'},
  'AHA-CKM26': {s:'AHA', n:'AHA/ACC/ADA/ASN 2026 – Hội chứng tim mạch–thận–chuyển hoá (CKM)', c:'Ndumele CE, et al. 2026 AHA/ACC/ADA/ASN Guideline for the Prevention, Detection, Evaluation, and Management of Cardiovascular-Kidney-Metabolic Syndrome. J Am Coll Cardiol 2026;87(22S):e1889–e2007.'}
};

/* Recommendation library. t = Vietnamese rendering of the guideline text. c = class, l = level. */
var R = {
 /* ---- ESC ACS 2023: antithrombotic ---- */
 e_acs_asp:{g:'ESC-ACS23',c:'I',l:'A',t:'Aspirin cho mọi BN không có chống chỉ định: liều nạp 150–300 mg, duy trì 75–100 mg/ngày điều trị lâu dài.'},
 e_acs_dapt:{g:'ESC-ACS23',c:'I',l:'A',t:'Ở mọi BN HCVC: thuốc ức chế P2Y12 phối hợp aspirin (liều nạp rồi duy trì) trong 12 tháng, trừ khi có nguy cơ chảy máu cao (HBR).'},
 e_acs_pras:{g:'ESC-ACS23',c:'I',l:'B',t:'Prasugrel ở BN chưa dùng thuốc ức chế P2Y12 tiến hành PCI: nạp 60 mg, duy trì 10 mg/ngày; 5 mg/ngày nếu ≥75 tuổi hoặc cân nặng <60 kg.'},
 e_acs_tica:{g:'ESC-ACS23',c:'I',l:'B',t:'Ticagrelor (nạp 180 mg, duy trì 90 mg × 2 lần/ngày) bất kể chiến lược điều trị (can thiệp hay bảo tồn).'},
 e_acs_clopi:{g:'ESC-ACS23',c:'I',l:'C',t:'Clopidogrel (nạp 300–600 mg, duy trì 75 mg/ngày) khi không có, không dung nạp hoặc chống chỉ định prasugrel/ticagrelor.'},
 e_acs_praspref:{g:'ESC-ACS23',c:'IIa',l:'B',t:'Nên cân nhắc ưu tiên prasugrel hơn ticagrelor ở BN HCVC được PCI.'},
 e_acs_clopiold:{g:'ESC-ACS23',c:'IIb',l:'B',t:'Ở BN HCVC cao tuổi (định nghĩa 70–80 tuổi tùy thử nghiệm), nhất là khi HBR, có thể cân nhắc clopidogrel làm thuốc ức chế P2Y12.'},
 e_acs_ppi:{g:'ESC-ACS23',c:'I',l:'A',t:'Phối hợp thuốc ức chế bơm proton (PPI) với DAPT ở BN nguy cơ cao xuất huyết tiêu hoá.'},
 e_acs_sapt36:{g:'ESC-ACS23',c:'IIa',l:'A',t:'BN không có biến cố sau 3–6 tháng DAPT và không có nguy cơ thiếu máu cao: nên cân nhắc chuyển sang đơn trị kháng tiểu cầu (ưu tiên thuốc ức chế P2Y12).'},
 e_acs_deesc:{g:'ESC-ACS23',c:'IIb',l:'A',t:'Có thể cân nhắc xuống thang thuốc ức chế P2Y12 (vd. prasugrel/ticagrelor → clopidogrel) như chiến lược DAPT thay thế để giảm nguy cơ chảy máu.'},
 e_acs_hbr1m:{g:'ESC-ACS23',c:'IIb',l:'B',t:'BN HBR: có thể cân nhắc đơn trị aspirin hoặc thuốc ức chế P2Y12 sau 1 tháng DAPT.'},
 e_acs_no30:{g:'ESC-ACS23',c:'III',l:'B',t:'Không khuyến cáo xuống thang kháng tiểu cầu trong 30 ngày đầu sau biến cố HCVC.'},
 e_acs_exthigh:{g:'ESC-ACS23',c:'IIa',l:'A',t:'Nên cân nhắc thêm thuốc chống huyết khối thứ hai vào aspirin để dự phòng thứ phát kéo dài ở BN nguy cơ thiếu máu cao và không HBR.'},
 e_acs_extmod:{g:'ESC-ACS23',c:'IIb',l:'A',t:'Có thể cân nhắc thêm thuốc chống huyết khối thứ hai vào aspirin để dự phòng thứ phát kéo dài ở BN nguy cơ thiếu máu trung bình và không HBR.'},
 e_acs_p2y12mono:{g:'ESC-ACS23',c:'IIb',l:'A',t:'Có thể cân nhắc đơn trị thuốc ức chế P2Y12 thay cho đơn trị aspirin khi điều trị lâu dài.'},
 /* ESC ACS 2023: OAC */
 e_acs_oac:{g:'ESC-ACS23',c:'I',l:'A',t:'Chiến lược mặc định ở BN rung nhĩ có CHA₂DS₂-VASc ≥1 (nam) hoặc ≥2 (nữ): sau tối đa 1 tuần điều trị chống huyết khối bộ ba, dùng phác đồ kép gồm NOAC liều chuẩn phòng đột quỵ + 1 thuốc kháng tiểu cầu (ưu tiên clopidogrel) đến 12 tháng.'},
 e_acs_oac1m:{g:'ESC-ACS23',c:'IIa',l:'C',t:'Ở BN dùng OAC: nên cân nhắc aspirin + clopidogrel kéo dài hơn 1 tuần và tới 1 tháng nếu nguy cơ thiếu máu cao hoặc có đặc điểm giải phẫu/thủ thuật được đánh giá là vượt trội nguy cơ chảy máu.'},
 e_acs_oac6:{g:'ESC-ACS23',c:'IIb',l:'B',t:'Ở BN cần OAC: có thể cân nhắc ngừng kháng tiểu cầu ở tháng thứ 6 và tiếp tục OAC.'},
 e_acs_oac12:{g:'ESC-ACS23',c:'I',l:'B',t:'Khuyến cáo ngừng thuốc kháng tiểu cầu sau 12 tháng ở BN đang dùng OAC.'},
 e_acs_notp:{g:'ESC-ACS23',c:'III',l:'C',t:'Không khuyến cáo dùng ticagrelor hoặc prasugrel trong phác đồ chống huyết khối bộ ba.'},
 e_acs_riva15:{g:'ESC-ACS23',c:'IIa',l:'B',t:'Khi dùng rivaroxaban và lo ngại HBR trội hơn đột quỵ thiếu máu: nên cân nhắc rivaroxaban 15 mg/ngày thay 20 mg/ngày trong thời gian dùng kèm SAPT/DAPT.'},
 e_acs_dabi110:{g:'ESC-ACS23',c:'IIa',l:'B',t:'BN HBR: nên cân nhắc dabigatran 110 mg × 2 thay 150 mg × 2 trong thời gian dùng kèm SAPT/DAPT.'},
 e_acs_vka:{g:'ESC-ACS23',c:'IIa',l:'B',t:'Khi phối hợp VKA với aspirin và/hoặc clopidogrel: nên điều chỉnh chặt liều VKA với INR đích 2,0–2,5 và TTR >70%.'},
 /* ESC CCS 2024 antithrombotic */
 e_ccs_asplife:{g:'ESC-CCS24',c:'I',l:'A',t:'BN HCVM mạn có tiền sử NMCT hoặc PCI trước đây: aspirin 75–100 mg/ngày suốt đời sau giai đoạn DAPT ban đầu.'},
 e_ccs_clopialt:{g:'ESC-CCS24',c:'I',l:'A',t:'Clopidogrel 75 mg/ngày là lựa chọn thay thế an toàn, hiệu quả cho đơn trị aspirin (BN có tiền sử NMCT hoặc PCI trước đây).'},
 e_ccs_ext:{g:'ESC-CCS24',c:'IIa',l:'A',t:'Nên cân nhắc thêm thuốc chống huyết khối thứ hai vào aspirin để dự phòng thứ phát kéo dài ở BN nguy cơ thiếu máu tăng và không HBR. Lựa chọn (Bảng 8): rivaroxaban 2,5 mg × 2; clopidogrel 75 mg; prasugrel 10 mg (5 mg nếu <60 kg hoặc ≥75 tuổi); ticagrelor 60/90 mg × 2.'},
 e_ccs_ticamono:{g:'ESC-CCS24',c:'IIb',l:'C',t:'BN đã PCI, ban đầu dùng DAPT có ticagrelor, vẫn nguy cơ thiếu máu cao và không HBR: có thể cân nhắc ticagrelor 90 mg × 2 đơn trị thay cho DAPT hay đơn trị kháng tiểu cầu khác.'},
 e_ccs_dapt6:{g:'ESC-CCS24',c:'I',l:'A',t:'HCVM mạn không có chỉ định OAC: DAPT aspirin 75–100 mg + clopidogrel 75 mg tới 6 tháng là chiến lược mặc định sau PCI–đặt stent.'},
 e_ccs_hbr13:{g:'ESC-CCS24',c:'I',l:'A',t:'BN HBR nhưng không có nguy cơ thiếu máu cao: ngừng DAPT sau 1–3 tháng kể từ PCI và tiếp tục đơn trị kháng tiểu cầu.'},
 e_ccs_short:{g:'ESC-CCS24',c:'IIb',l:'B',t:'Có thể cân nhắc ngừng DAPT sau 1–3 tháng ở BN không HBR và không có nguy cơ thiếu máu cao.'},
 e_ccs_potent:{g:'ESC-CCS24',c:'IIb',l:'C',t:'Đặt stent nguy cơ huyết khối cao (thân chung phức tạp, chỗ chia đôi 2 stent, kết quả stent chưa tối ưu, tiền sử huyết khối stent, đa hình CYP2C19 *2/*3 đã biết): có thể cân nhắc prasugrel hoặc ticagrelor (kèm aspirin) thay clopidogrel trong tháng đầu, tới 3–6 tháng.'},
 e_ccs_oacasp:{g:'ESC-CCS24',c:'I',l:'C',t:'BN có chỉ định OAC được PCI: dùng aspirin liều thấp ban đầu (nạp nếu chưa dùng) phối hợp OAC và clopidogrel.'},
 e_ccs_doac:{g:'ESC-CCS24',c:'I',l:'A',t:'Ở BN đủ điều kiện dùng OAC: ưu tiên DOAC hơn VKA (trừ khi chống chỉ định).'},
 e_ccs_oacreg:{g:'ESC-CCS24',c:'I',l:'A',t:'Sau PCI không biến chứng ở BN có chỉ định OAC: ngừng aspirin sớm (≤1 tuần) → OAC + clopidogrel tới 6 tháng (nếu không có nguy cơ thiếu máu cao) hoặc tới 12 tháng (nếu nguy cơ thiếu máu cao) → sau đó OAC đơn độc.'},
 e_ccs_oacasp1m:{g:'ESC-CCS24',c:'IIa',l:'B',t:'Nên cân nhắc tiếp tục aspirin tới 1 tháng sau PCI (kèm OAC + clopidogrel) ở BN nguy cơ thiếu máu cao hoặc có đặc điểm giải phẫu/thủ thuật được đánh giá là vượt trội nguy cơ chảy máu.'},
 e_ccs_oaclife:{g:'ESC-CCS24',c:'I',l:'B',t:'HCVM mạn có chỉ định OAC lâu dài: VKA liều điều trị rung nhĩ đơn độc, hoặc ưu tiên DOAC đơn độc (nếu không chống chỉ định), suốt đời.'},
 e_ccs_riva15:{g:'ESC-CCS24',c:'IIa',l:'B',t:'Khi lo ngại HBR trội hơn huyết khối stent/đột quỵ: nên cân nhắc rivaroxaban 15 mg/ngày thay 20 mg/ngày trong thời gian dùng kèm kháng tiểu cầu.'},
 e_ccs_dabi110:{g:'ESC-CCS24',c:'IIa',l:'B',t:'Khi lo ngại HBR trội hơn huyết khối stent/đột quỵ: nên cân nhắc dabigatran 110 mg × 2 thay 150 mg × 2 trong thời gian dùng kèm kháng tiểu cầu.'},
 e_ccs_vka:{g:'ESC-CCS24',c:'IIa',l:'B',t:'Khi phối hợp VKA với đơn hoặc kép kháng tiểu cầu: nên nhắm INR ở phần thấp của khoảng khuyến cáo và TTR >70%.'},
 e_ccs_notp:{g:'ESC-CCS24',c:'III',l:'C',t:'Nhìn chung không khuyến cáo ticagrelor hoặc prasugrel trong phác đồ bộ ba với aspirin và OAC.'},
 e_ccs_ppi:{g:'ESC-CCS24',c:'I',l:'A',t:'PPI ở BN tăng nguy cơ xuất huyết tiêu hoá trong suốt thời gian phối hợp thuốc chống huyết khối (kháng tiểu cầu và/hoặc OAC).'},
 e_ccs_ppi1:{g:'ESC-CCS24',c:'IIa',l:'A',t:'Nên cân nhắc PPI khi chỉ dùng một thuốc chống huyết khối, tùy nguy cơ xuất huyết tiêu hoá của từng BN.'},
 e_ccs_bleedassess:{g:'ESC-CCS24',c:'I',l:'B',t:'Đánh giá nguy cơ chảy máu bằng thang điểm PRECISE-DAPT, công cụ định tính ARC-HBR hoặc phương pháp khác đã được thẩm định.'},
 /* ESC AF 2024 */
 e_af_oac:{g:'ESC-AF24',c:'I',l:'A',t:'Kháng đông đường uống ở BN rung nhĩ lâm sàng có nguy cơ huyết khối tắc mạch tăng.'},
 e_af_cha2:{g:'ESC-AF24',c:'I',l:'C',t:'CHA₂DS₂-VA ≥2 là chỉ điểm nguy cơ huyết khối tắc mạch tăng để quyết định khởi trị OAC.'},
 e_af_cha1:{g:'ESC-AF24',c:'IIa',l:'C',t:'CHA₂DS₂-VA = 1 nên được xem là chỉ điểm nguy cơ huyết khối tắc mạch tăng để quyết định khởi trị OAC.'},
 e_af_doacpref:{g:'ESC-AF24',c:'I',l:'A',t:'Khi phối hợp với kháng tiểu cầu: ưu tiên DOAC hơn VKA ở BN đủ điều kiện để giảm chảy máu và phòng huyết khối tắc mạch.'},
 e_af_doacvalve:{g:'ESC-AF24',c:'I',l:'A',t:'DOAC được ưu tiên hơn VKA để phòng đột quỵ, TRỪ BN có van tim cơ học hoặc hẹp van hai lá vừa–nặng.'},
 e_af_acs:{g:'ESC-AF24',c:'I',l:'A',t:'Rung nhĩ + HCVC được PCI không biến chứng: ngừng aspirin sớm (≤1 tuần), tiếp OAC (ưu tiên DOAC) + thuốc ức chế P2Y12 (ưu tiên clopidogrel) tới 12 tháng nếu nguy cơ huyết khối thấp hoặc HBR.'},
 e_af_acs1m:{g:'ESC-AF24',c:'IIa',l:'C',t:'Nên cân nhắc phác đồ bộ ba (aspirin, clopidogrel, OAC) dài hơn 1 tuần sau HCVC khi nguy cơ thiếu máu vượt trội nguy cơ chảy máu; tổng thời gian ≤1 tháng, ghi rõ trong kế hoạch ra viện.'},
 e_af_pci:{g:'ESC-AF24',c:'I',l:'A',t:'Sau PCI không biến chứng: ngừng aspirin sớm (≤1 tuần), tiếp OAC + thuốc ức chế P2Y12 (ưu tiên clopidogrel) tới 6 tháng nếu nguy cơ thiếu máu thấp.'},
 e_af_pci1m:{g:'ESC-AF24',c:'IIa',l:'B',t:'Nên cân nhắc phác đồ bộ ba dài hơn 1 tuần sau PCI khi nguy cơ huyết khối stent vượt trội nguy cơ chảy máu; tổng thời gian ≤1 tháng.'},
 e_af_no12:{g:'ESC-AF24',c:'III',l:'B',t:'Không khuyến cáo kháng tiểu cầu sau 12 tháng ở BN bệnh mạch vành/mạch máu mạn ổn định đang dùng OAC (không tăng hiệu quả, tăng chảy máu nặng).'},
 e_af_riva15:{g:'ESC-AF24',c:'IIa',l:'B',t:'Nên cân nhắc rivaroxaban 15 mg/ngày thay 20 mg/ngày khi phối hợp kháng tiểu cầu ở BN mà lo ngại chảy máu trội hơn huyết khối stent/đột quỵ.'},
 e_af_dabi110:{g:'ESC-AF24',c:'IIa',l:'B',t:'Nên cân nhắc dabigatran 110 mg × 2 thay 150 mg × 2 khi phối hợp kháng tiểu cầu ở BN mà lo ngại chảy máu trội hơn huyết khối stent/đột quỵ.'},
 e_af_vka:{g:'ESC-AF24',c:'IIa',l:'C',t:'Khi phối hợp VKA với kháng tiểu cầu: nên chỉnh liều chặt với INR đích 2,0–2,5 và TTR >70%.'},
 e_af_lowdose:{g:'ESC-AF24',c:'III',l:'B',t:'Không khuyến cáo giảm liều DOAC trừ khi BN đáp ứng tiêu chí giảm liều riêng của từng thuốc (tránh dưới liều).'},
 e_af_bleedmod:{g:'ESC-AF24',c:'I',l:'B',t:'Đánh giá và xử trí các yếu tố nguy cơ chảy máu có thể thay đổi được ở mọi BN đủ điều kiện dùng OAC.'},
 e_af_noscore:{g:'ESC-AF24',c:'III',l:'B',t:'Không dùng thang điểm nguy cơ chảy máu để quyết định bắt đầu hay ngừng OAC ở BN rung nhĩ.'},
 /* AHA ACS 2025 */
 a_acs_asp:{g:'AHA-ACS25',c:'1',l:'A',t:'Aspirin liều nạp, sau đó aspirin liều thấp hằng ngày (75–100 mg theo phần diễn giải) để giảm tử vong và MACE.'},
 a_acs_dapt:{g:'AHA-ACS25',c:'1',l:'A',t:'BN HCVC không HBR: DAPT aspirin + thuốc ức chế P2Y12 uống ít nhất 1 năm để giảm MACE.'},
 a_acs_ticamono:{g:'AHA-ACS25',c:'1',l:'A',t:'BN HCVC đã dung nạp DAPT với ticagrelor: chuyển sang ticagrelor đơn trị sau ≥1 tháng kể từ PCI để giảm chảy máu.'},
 a_acs_ppi:{g:'AHA-ACS25',c:'1',l:'A',t:'BN nguy cơ cao xuất huyết tiêu hoá: dùng PPI kèm DAPT, OAC hoặc cả hai.'},
 a_acs_deesc:{g:'AHA-ACS25',c:'2b',l:'B-R',t:'BN HCVC được PCI: có thể hợp lý xuống thang DAPT (ticagrelor/prasugrel → clopidogrel) sau 1 tháng để giảm chảy máu.'},
 a_acs_hbr:{g:'AHA-ACS25',c:'2b',l:'B-R',t:'BN HCVC được PCI có HBR: có thể hợp lý chuyển sang đơn trị kháng tiểu cầu (aspirin hoặc thuốc ức chế P2Y12) sau 1 tháng.'},
 a_acs_nstept:{g:'AHA-ACS25',c:'1',l:'B-R',t:'NSTE-ACS được PCI: khuyến cáo prasugrel hoặc ticagrelor để giảm MACE và huyết khối stent.'},
 a_acs_stemipt:{g:'AHA-ACS25',c:'1',l:'B-R',t:'STEMI được PCI tiên phát: dùng prasugrel hoặc ticagrelor để giảm MACE và huyết khối stent.'},
 a_acs_nsteclopi:{g:'AHA-ACS25',c:'1',l:'B-R',t:'NSTE-ACS: clopidogrel khi prasugrel/ticagrelor không có, không dung nạp hoặc chống chỉ định.'},
 a_acs_stemiclopi:{g:'AHA-ACS25',c:'1',l:'C-LD',t:'STEMI được PCI tiên phát: clopidogrel khi prasugrel/ticagrelor không có, không dung nạp hoặc chống chỉ định.'},
 a_acs_prasstroke:{g:'AHA-ACS25',c:'3: Harm',l:'B-R',t:'BN có tiền sử đột quỵ hoặc TIA: không dùng prasugrel (kết cục lâm sàng thực sự xấu hơn).'},
 a_acs_oac:{g:'AHA-ACS25',c:'1',l:'B-R',t:'BN HCVC cần OAC: ngừng aspirin sau 1–4 tuần điều trị bộ ba, tiếp tục thuốc ức chế P2Y12 (ưu tiên clopidogrel) + OAC để giảm chảy máu.'},
 /* AHA CCD 2023 */
 a_ccd_asp:{g:'AHA-CCD23',c:'1',l:'A',t:'BN bệnh mạch vành mạn không có chỉ định OAC: aspirin liều thấp 81 mg (75–100 mg) để giảm biến cố xơ vữa.'},
 a_ccd_dapt6:{g:'AHA-CCD23',c:'1',l:'A',t:'BN bệnh mạch vành mạn được PCI: DAPT aspirin + clopidogrel 6 tháng, sau đó đơn trị kháng tiểu cầu (SAPT).'},
 a_ccd_p2y12mono:{g:'AHA-CCD23',c:'2a',l:'A',t:'BN được PCI với DES đã hoàn thành 1–3 tháng DAPT (BN chọn lọc): đơn trị thuốc ức chế P2Y12 ít nhất 12 tháng là hợp lý để giảm chảy máu.'},
 a_ccd_extdapt:{g:'AHA-CCD23',c:'2b',l:'A',t:'BN có tiền sử NMCT và nguy cơ chảy máu thấp: DAPT kéo dài quá 12 tháng, tới 3 năm, có thể hợp lý để giảm MACE.'},
 a_ccd_noclopi:{g:'AHA-CCD23',c:'3: No benefit',l:'A',t:'Không có HCVC gần đây hay chỉ định DAPT liên quan PCI: thêm clopidogrel vào aspirin không có lợi.'},
 a_ccd_prasstroke:{g:'AHA-CCD23',c:'3: Harm',l:'B-R',t:'BN có tiền sử đột quỵ, TIA hoặc xuất huyết nội sọ: không dùng prasugrel.'},
 a_ccd_nsaid:{g:'AHA-CCD23',c:'3: Harm',l:'B-R',t:'Không dùng NSAID kéo dài (tăng biến chứng tim mạch và chảy máu).'},
 a_ccd_oac:{g:'AHA-CCD23',c:'1',l:'B-R',t:'PCI chương trình ở BN cần OAC: DAPT 1–4 tuần, sau đó clopidogrel đơn độc tới 6 tháng, kèm DOAC.'},
 a_ccd_oacasp:{g:'AHA-CCD23',c:'2a',l:'B-R',t:'BN cần OAC sau PCI: tiếp aspirin cùng clopidogrel tới 1 tháng là hợp lý nếu nguy cơ huyết khối cao và nguy cơ chảy máu thấp.'},
 a_ccd_oac1y:{g:'AHA-CCD23',c:'2b',l:'B-R',t:'BN cần OAC có nguy cơ huyết khối xơ vữa thấp: có thể cân nhắc ngừng kháng tiểu cầu và dùng DOAC đơn độc sau 1 năm kể từ PCI.'},
 a_ccd_doacmono:{g:'AHA-CCD23',c:'2b',l:'C-LD',t:'BN cần OAC: có thể cân nhắc đơn trị DOAC nếu không còn chỉ định cấp phối hợp kháng tiểu cầu.'},
 a_ccd_riva:{g:'AHA-CCD23',c:'2a',l:'B-R',t:'Không có chỉ định DOAC liều điều trị hay DAPT, nguy cơ thiếu máu tái phát cao, nguy cơ chảy máu thấp–trung bình: thêm rivaroxaban 2,5 mg × 2 vào aspirin 81 mg là hợp lý.'},
 a_ccd_ppi:{g:'AHA-CCD23',c:'2a',l:'B-R',t:'BN đang DAPT: PPI có thể hiệu quả để giảm xuất huyết tiêu hoá.'},
 /* ESC CKD 2026 antithrombotic */
 e_ckd_sapt:{g:'ESC-CKD26',c:'I',l:'C',t:'HCVM mạn + CKD, không có chỉ định kháng đông: kháng tiểu cầu bằng aspirin liều thấp hoặc clopidogrel.'},
 e_ckd_clopi:{g:'ESC-CKD26',c:'IIa',l:'B1',t:'HCVM mạn + CKD với eGFR >30, không có chỉ định kháng đông: nên ưu tiên clopidogrel hơn aspirin liều thấp.'},
 e_ckd_ccsdapt:{g:'ESC-CKD26',c:'IIa',l:'B2',t:'CKD + HCVM mạn được PCI chương trình, không có chỉ định kháng đông: nên cân nhắc rút ngắn DAPT (1–3 tháng) để giảm chảy máu.'},
 e_ckd_acsdapt:{g:'ESC-CKD26',c:'IIa',l:'B1',t:'HCVC + CKD không có chỉ định kháng đông: nên cân nhắc rút ngắn DAPT (3 tháng, sau đó aspirin hoặc thuốc ức chế P2Y12) hoặc xuống thang DAPT (prasugrel/ticagrelor → clopidogrel) sau 1–3 tháng để giảm chảy máu nặng.'},
 e_ckd_af30:{g:'ESC-CKD26',c:'I',l:'A',t:'Rung nhĩ + CKD với eGFR ≥30: ưu tiên DOAC hơn VKA.'},
 e_ckd_af15:{g:'ESC-CKD26',c:'IIa',l:'B1',t:'Rung nhĩ + CKD với eGFR 15–29: nên ưu tiên thuốc ức chế yếu tố Xa đường uống hơn VKA.'},
 e_ckd_af0:{g:'ESC-CKD26',c:'IIa',l:'C',t:'Rung nhĩ + eGFR <15 (kể cả đang điều trị thay thế thận): nên cá thể hoá quyết định kháng đông.'},
 e_ckd_noapt:{g:'ESC-CKD26',c:'III',l:'B1',t:'(Tham khảo) Không dùng thường quy kháng tiểu cầu ở CKD eGFR <60 KHÔNG có bệnh xơ vữa có triệu chứng – không áp dụng cho BN sau PCI.'},

 /* ---- BP ---- */
 e_htn_target:{g:'ESC-HTN24',c:'I',l:'A',t:'Đích HA tâm thu khi điều trị ở đa số người lớn: 120–129 mmHg, nếu dung nạp tốt.'},
 e_htn_alara:{g:'ESC-HTN24',c:'I',l:'A',t:'Nếu điều trị dung nạp kém và không đạt 120–129 mmHg: nhắm HA tâm thu “thấp nhất có thể đạt được một cách hợp lý” (ALARA).'},
 e_htn_lenient:{g:'ESC-HTN24',c:'IIa',l:'C',t:'Nên cân nhắc đích HA cá thể hoá, nới hơn (vd. <140 mmHg) ở BN hạ HA tư thế có triệu chứng trước điều trị và/hoặc ≥85 tuổi.'},
 e_htn_frail:{g:'ESC-HTN24',c:'IIb',l:'C',t:'Có thể cân nhắc đích HA nới hơn (vd. <140/90 mmHg) ở BN suy yếu (frailty) vừa–nặng hoặc tuổi thọ dự kiến <3 năm.'},
 e_htn_dbp:{g:'ESC-HTN24',c:'IIb',l:'C',t:'Khi HA tâm thu đã đạt (120–129) nhưng HA tâm trương ≥80 mmHg: có thể tăng cường điều trị để đạt HA tâm trương 70–79 mmHg.'},
 e_htn_mi:{g:'ESC-HTN24',c:'I',l:'A',t:'BN có tiền sử NMCT cần hạ HA: chẹn beta và thuốc ức chế hệ RAS là một phần của điều trị.'},
 e_htn_angina:{g:'ESC-HTN24',c:'I',l:'A',t:'BN đau thắt ngực có triệu chứng cần hạ HA: chẹn beta và/hoặc chẹn kênh canxi là một phần của điều trị.'},
 e_htn_first:{g:'ESC-HTN24',c:'I',l:'A',t:'ACEi, ARB, chẹn kênh canxi DHP và lợi tiểu (thiazide/giống thiazide) là thuốc hàng đầu để hạ HA.'},
 e_htn_bb:{g:'ESC-HTN24',c:'I',l:'A',t:'Phối hợp chẹn beta với các nhóm hạ HA chính khác khi có chỉ định bắt buộc (đau thắt ngực, sau NMCT, HFrEF, kiểm soát tần số).'},
 e_htn_combo:{g:'ESC-HTN24',c:'I',l:'B',t:'THA đã xác định (≥140/90 mmHg): khởi trị phối hợp, ưu tiên thuốc ức chế RAS + chẹn kênh canxi DHP hoặc lợi tiểu (ngoại lệ: ≥85 tuổi, hạ HA tư thế có triệu chứng, suy yếu vừa–nặng, HA tăng 120–139/70–89 kèm chỉ định khác).'},
 e_htn_init130:{g:'ESC-HTN24',c:'I',l:'A',t:'HA tăng và nguy cơ tim mạch đủ cao (bao gồm bệnh tim mạch đã xác định): sau 3 tháng thay đổi lối sống, điều trị thuốc khi HA ≥130/80 mmHg được xác nhận.'},
 e_htn_ohtest:{g:'ESC-HTN24',c:'I',l:'B',t:'Trước khi bắt đầu/tăng cường thuốc hạ HA: kiểm tra hạ HA tư thế (ngồi/nằm 5 phút, đo lại sau 1 và/hoặc 3 phút đứng).'},
 e_htn_life:{g:'ESC-HTN24',c:'I',l:'A',t:'Duy trì thuốc hạ HA suốt đời, kể cả sau 85 tuổi, nếu dung nạp tốt.'},
 e_htn_dm:{g:'ESC-HTN24',c:'I',l:'A',t:'BN ĐTĐ đang dùng thuốc hạ HA: đích HA tâm thu 120–129 mmHg nếu dung nạp.'},
 e_htn_ckd:{g:'ESC-HTN24',c:'I',l:'A',t:'CKD vừa–nặng đang dùng thuốc hạ HA và eGFR >30: đích HA tâm thu 120–129 mmHg nếu dung nạp; cá thể hoá khi eGFR thấp hơn hoặc ghép thận.'},
 e_htn_ckdsglt2:{g:'ESC-HTN24',c:'I',l:'A',t:'THA + CKD với eGFR >20: khuyến cáo ức chế SGLT2 để cải thiện kết cục.'},
 e_htn_ckdacei:{g:'ESC-HTN24',c:'IIa',l:'B',t:'Nên dùng ACEi hoặc ARB trong phác đồ ở BN THA có albumin niệu vi lượng hoặc protein niệu.'},
 e_ckd_bp:{g:'ESC-CKD26',c:'I',l:'A',t:'CKD với eGFR ≥30: đích HA tâm thu 120–129 mmHg nếu dung nạp, để giảm nguy cơ tim mạch và giảm albumin niệu.'},
 e_ckd_bplow:{g:'ESC-CKD26',c:'I',l:'C',t:'CKD với eGFR <30: khuyến cáo đích HA cá thể hoá.'},
 a_htn_init:{g:'AHA-HTN25',c:'1',l:'A',t:'THA + bệnh tim mạch lâm sàng: khởi trị thuốc hạ HA khi HA tâm thu trung bình ≥130 mmHg.'},
 a_htn_goal:{g:'AHA-HTN25',c:'1',l:'A',t:'THA ở người tăng nguy cơ tim mạch: đích HA tâm thu ít nhất <130 mmHg, khuyến khích đạt <120 mmHg.'},
 a_htn_dbp:{g:'AHA-HTN25',c:'1',l:'B-R',t:'THA ở người tăng nguy cơ tim mạch: đích HA tâm trương <80 mmHg.'},
 a_htn_dm:{g:'AHA-HTN25',c:'1',l:'A',t:'ĐTĐ týp 2 + THA: bắt đầu thuốc khi HA tâm thu ≥130 mmHg, đích <130 mmHg, khuyến khích <120 mmHg.'},
 a_htn_dmdbp:{g:'AHA-HTN25',c:'1',l:'C-LD',t:'ĐTĐ týp 2 + THA: bắt đầu thuốc khi HA tâm trương ≥80 mmHg, đích <80 mmHg.'},
 a_htn_ckd:{g:'AHA-HTN25',c:'1',l:'A',t:'THA + CKD (eGFR <60 hoặc albumin niệu ≥30 mg/g): đích HA tâm thu <130 mmHg.'},
 a_htn_ckdraas:{g:'AHA-HTN25',c:'1',l:'B-R',t:'THA + CKD (eGFR <60) kèm albumin niệu ≥30 mg/g: dùng thuốc ức chế RAA (ACEi hoặc ARB, không phối hợp cả hai).'},
 a_ccd_bpgoal:{g:'AHA-CCD23',c:'1',l:'B-R',t:'Bệnh mạch vành mạn có THA: đích HA <130/<80 mmHg.'},
 a_ccd_bpdrug:{g:'AHA-CCD23',c:'1',l:'B-R',t:'Bệnh mạch vành mạn + THA (≥130/80): ACEi, ARB hoặc chẹn beta là thuốc hàng đầu khi có chỉ định bắt buộc (vd. NMCT gần đây, đau thắt ngực); thêm chẹn kênh canxi DHP, lợi tiểu thiazide tác dụng dài và/hoặc MRA khi cần.'},
 a_ccd_bplife:{g:'AHA-CCD23',c:'1',l:'A',t:'Bệnh mạch vành mạn có HA tăng (120–129/<80 mmHg): biện pháp không dùng thuốc là điều trị đầu tay.'},

 /* ---- Diabetes / metabolic ---- */
 e_ccs_sglt2:{g:'ESC-CCS24',c:'I',l:'A',t:'ĐTĐ týp 2 + HCVM mạn: ức chế SGLT2 có lợi ích tim mạch đã chứng minh, độc lập với HbA1c nền/đích và thuốc hạ đường huyết đang dùng.'},
 e_ccs_glp1:{g:'ESC-CCS24',c:'I',l:'A',t:'ĐTĐ týp 2 + HCVM mạn: đồng vận thụ thể GLP-1 có lợi ích tim mạch đã chứng minh, độc lập với HbA1c nền/đích và thuốc hạ đường huyết đang dùng.'},
 e_ccs_sema:{g:'ESC-CCS24',c:'IIa',l:'B',t:'BN HCVM mạn KHÔNG ĐTĐ, thừa cân (BMI >27 kg/m²) hoặc béo phì: nên cân nhắc semaglutide để giảm tử vong tim mạch, NMCT, đột quỵ.'},
 e_dm23_a1c:{g:'ESC-DM23',c:'I',l:'A',t:'Kiểm soát đường huyết chặt (HbA1c <7%, <53 mmol/mol) để giảm biến chứng vi mạch.'},
 e_ckd_a1c:{g:'ESC-CKD26',c:'I',l:'B1',t:'ĐTĐ + CKD: đích HbA1c cá thể hoá trong khoảng <6,5% đến <8,0%, nhắm <7,0% bất cứ khi nào có thể.'},
 e_ckd_dmfirst:{g:'ESC-CKD26',c:'I',l:'A',t:'ĐTĐ týp 2 + CKD: ức chế SGLT2 và GLP-1 RA là thuốc hạ đường huyết hàng đầu (lợi ích trên tiến triển CKD và biến cố tim mạch).'},
 e_ckd_metf:{g:'ESC-CKD26',c:'IIa',l:'B1',t:'ĐTĐ týp 2 + CKD với eGFR ≥30: nên cân nhắc metformin để hạ đường huyết thêm.'},
 e_ckd_insulin:{g:'ESC-CKD26',c:'I',l:'A',t:'ĐTĐ týp 2 + CKD: dùng insulin nếu không đạt đích đường huyết với thuốc uống hoặc GLP-1 RA.'},
 a_ccd_sglt2glp1:{g:'AHA-CCD23',c:'1',l:'A',t:'Bệnh mạch vành mạn + ĐTĐ týp 2: dùng ức chế SGLT2 hoặc GLP-1 RA có lợi ích tim mạch đã chứng minh để giảm MACE.'},
 a_ckm_life:{g:'AHA-CKM26',c:'1',l:'A',t:'CKM giai đoạn 4 với ĐTĐ týp 2 + ASCVD: kế hoạch thay đổi lối sống cá thể hoá (chế độ ăn có lợi cho tim, hoạt động thể lực).'},
 a_ckm_sglt2glp1:{g:'AHA-CKM26',c:'1',l:'A',t:'CKM giai đoạn 4 với ĐTĐ týp 2 + ASCVD: dùng ức chế SGLT2 hoặc liệu pháp nền GLP-1 có lợi ích tim mạch đã chứng minh để giảm biến cố và tử vong tim mạch.'},
 a_ckm_combo:{g:'AHA-CKM26',c:'2a',l:'C-LD',t:'CKM giai đoạn 4 với ĐTĐ týp 2 + ASCVD: phối hợp ức chế SGLT2 và liệu pháp nền GLP-1 có thể có lợi để cải thiện kết cục tim mạch.'},
 a_ckm_hfsglt2:{g:'AHA-CKM26',c:'1',l:'A',t:'CKM giai đoạn 4 với ĐTĐ týp 2 + suy tim: ưu tiên ức chế SGLT2 là thuốc hạ đường huyết bảo vệ tim hàng đầu.'},
 a_ckm_obes:{g:'AHA-CKM26',c:'1',l:'B-R',t:'Thừa cân/béo phì (BMI ≥27 kg/m²) + ASCVD: liệu pháp nền GLP-1 có lợi ích tim mạch đã chứng minh, kèm tư vấn ăn uống và vận động, để giảm biến cố tim mạch.'},
 a_ckm_obeslife:{g:'AHA-CKM26',c:'1',l:'A',t:'Thừa cân/béo phì + ASCVD: can thiệp lối sống hành vi tích cực, đa thành phần để giảm cân và cải thiện yếu tố nguy cơ CKM.'},
 a_ckm_harm:{g:'AHA-CKM26',c:'3: Harm',l:'B-R',t:'Thừa cân/béo phì + ASCVD: naltrexone/bupropion hoặc thuốc chứa phentermine có thể gây hại (tăng HA và nhịp tim).'},

 /* ---- Lipids ---- */
 e_lip_goal:{g:'ESC-CCS24',c:'I',l:'A',t:'Điều trị hạ lipid với đích LDL-C <1,4 mmol/L (<55 mg/dL) và giảm ≥50% so với nền (cùng khuyến cáo I-A trong ESC 2023 HCVC).'},
 e_lip_statin:{g:'ESC-CCS24',c:'I',l:'A',t:'Statin cường độ cao tới liều cao nhất dung nạp được để đạt đích LDL-C cho mọi BN HCVM mạn (ESC 2023 HCVC: khởi động/tiếp tục statin liều cao càng sớm càng tốt, I-A).'},
 e_lip_eze:{g:'ESC-ACS23',c:'I',l:'B',t:'Không đạt đích LDL-C dù statin liều tối đa dung nạp sau 4–6 tuần: thêm ezetimibe.'},
 e_lip_pcsk9:{g:'ESC-ACS23',c:'I',l:'A',t:'Không đạt đích LDL-C dù statin tối đa + ezetimibe sau 4–6 tuần: thêm thuốc ức chế PCSK9.'},
 e_lip_bempe_intol:{g:'ESC-CCS24',c:'I',l:'B',t:'Không dung nạp statin và không đạt đích với ezetimibe: phối hợp acid bempedoic.'},
 e_lip_bempe_add:{g:'ESC-LIP25',c:'IIa',l:'C',t:'Nên cân nhắc thêm acid bempedoic vào statin liều tối đa dung nạp ± ezetimibe ở BN nguy cơ cao/rất cao để đạt đích LDL-C.'},
 e_lip_nonstatin:{g:'ESC-LIP25',c:'I',l:'A',t:'BN không thể dùng statin: dùng các thuốc không phải statin có lợi ích tim mạch đã chứng minh (đơn độc hoặc phối hợp), chọn theo mức LDL-C cần giảm thêm.'},
 e_lip_40:{g:'ESC-ACS23',c:'IIb',l:'B',t:'Biến cố xơ vữa huyết khối tái phát (trong vòng 2 năm sau HCVC đầu) khi đang dùng statin tối đa dung nạp: có thể cân nhắc đích LDL-C <1,0 mmol/L (<40 mg/dL).'},
 e_lip_intens:{g:'ESC-LIP25',c:'I',l:'C',t:'Tăng cường điều trị hạ lipid ngay trong lần nhập viện HCVC ở BN đã dùng thuốc hạ lipid trước đó.'},
 e_lip_combo:{g:'ESC-LIP25',c:'IIa',l:'B',t:'Nên cân nhắc khởi trị phối hợp statin cường độ cao + ezetimibe ngay trong lần nhập viện HCVC ở BN chưa điều trị và dự kiến không đạt đích LDL-C với statin đơn độc.'},
 e_lip_lpa:{g:'ESC-LIP25',c:'IIa',l:'B',t:'Lp(a) >50 mg/dL (105 nmol/L) nên được xem là yếu tố làm tăng nguy cơ tim mạch ở mọi người lớn; Lp(a) càng cao nguy cơ càng tăng.'},
 e_lip_ipe:{g:'ESC-LIP25',c:'IIa',l:'B',t:'Nên cân nhắc icosapent ethyl liều cao (2 g × 2/ngày) phối hợp statin ở BN nguy cơ cao/rất cao có TG lúc đói 135–499 mg/dL (1,52–5,63 mmol/L).'},
 e_ckd_statin:{g:'ESC-CKD26',c:'I',l:'A',t:'CKD (eGFR <60, chưa điều trị thay thế thận) hoặc HCVM mạn + CKD: phác đồ dựa trên statin ± ezetimibe đã chứng minh an toàn ở CKD, bất kể mức lipid.'},
 e_ckd_pcsk9:{g:'ESC-CKD26',c:'IIa',l:'B1',t:'HCVM mạn + CKD (eGFR ≥20) có LDL-C ≥1,8 mmol/L (70 mg/dL) hoặc non-HDL-C ≥2,6 mmol/L (100 mg/dL) dù statin ± ezetimibe: nên cân nhắc thêm thuốc ức chế PCSK9.'},
 a_lip_vhr:{g:'AHA-LIP26',c:'1',l:'A',t:'ASCVD nguy cơ rất cao: statin cường độ cao để giảm LDL-C ≥50%, đích LDL-C <55 mg/dL (1,4 mmol/L) và non-HDL-C <85 mg/dL (2,2 mmol/L).'},
 a_lip_vhradd:{g:'AHA-LIP26',c:'1',l:'A',t:'ASCVD nguy cơ rất cao đang dùng statin tối đa dung nạp: thêm ezetimibe và/hoặc kháng thể đơn dòng PCSK9 (chọn theo mức cần giảm LDL-C và ý muốn BN) để đạt LDL-C <55 mg/dL và non-HDL-C <85 mg/dL. Không bắt buộc dùng ezetimibe trước PCSK9 mAb.'},
 a_lip_vhrbempe:{g:'AHA-LIP26',c:'2a',l:'B-R',t:'ASCVD nguy cơ rất cao, statin tối đa dung nạp: hợp lý thêm acid bempedoic (± ezetimibe và/hoặc PCSK9 mAb) để đạt LDL-C <55 mg/dL.'},
 a_lip_vhrincl:{g:'AHA-LIP26',c:'2a',l:'B-R',t:'ASCVD nguy cơ rất cao, statin tối đa ± ezetimibe: hợp lý thêm inclisiran nếu không dung nạp/không tiếp cận được evolocumab/alirocumab hoặc muốn liều thưa hơn (chưa có thử nghiệm kết cục tim mạch hoàn tất).'},
 a_lip_nvhr:{g:'AHA-LIP26',c:'1',l:'A',t:'ASCVD không thuộc nhóm nguy cơ rất cao: statin cường độ cao để giảm LDL-C ≥50%, đích LDL-C <70 mg/dL (1,8 mmol/L) và non-HDL-C <100 mg/dL.'},
 a_lip_nvhradd:{g:'AHA-LIP26',c:'2a',l:'B-R',t:'ASCVD không thuộc nhóm nguy cơ rất cao, statin tối đa dung nạp: hợp lý thêm ezetimibe, PCSK9 mAb hoặc acid bempedoic để đạt LDL-C <70 mg/dL (và có thể nhắm <55 mg/dL, cũng 2a/B-R).'},
 a_lip_mon:{g:'AHA-LIP26',c:'1',l:'A',t:'BN đang điều trị hạ lipid: xét nghiệm bộ lipid 4–12 tuần sau khi bắt đầu hoặc chỉnh liều, sau đó mỗi 6–12 tháng.'},
 a_lip_lpa:{g:'AHA-LIP26',c:'1',l:'B-NR',t:'Đo nồng độ Lp(a) ít nhất một lần ở mọi người lớn để đánh giá nguy cơ ASCVD.'},
 a_lip_tg:{g:'AHA-LIP26',c:'1',l:'B-R',t:'ASCVD có LDL-C ≥55 mg/dL và non-HDL-C ≥85 mg/dL khi đang dùng statin tối đa, TG tồn tại 150–999 mg/dL: tăng cường điều trị hạ LDL-C.'},
 a_lip_ipe:{g:'AHA-LIP26',c:'2b',l:'B-R',t:'Người ≥50 tuổi có ASCVD, TG tồn tại 150–499 mg/dL và LDL-C <100 mg/dL khi dùng statin tối đa: thêm icosapent ethyl có thể hợp lý.'},
 a_acs_statin:{g:'AHA-ACS25',c:'1',l:'A',t:'BN HCVC: statin cường độ cao để giảm MACE.'},
 a_acs_lip70:{g:'AHA-ACS25',c:'1',l:'A',t:'BN HCVC đã dùng statin tối đa dung nạp mà LDL-C ≥70 mg/dL (≥1,8 mmol/L): thêm thuốc hạ lipid không phải statin.'},
 a_acs_lip55:{g:'AHA-ACS25',c:'2a',l:'B-R',t:'BN HCVC đã dùng statin tối đa dung nạp mà LDL-C 55–69 mg/dL (1,4 đến <1,8 mmol/L): hợp lý thêm thuốc hạ lipid không phải statin.'},
 a_acs_lipintol:{g:'AHA-ACS25',c:'1',l:'B-R',t:'BN HCVC không dung nạp statin: dùng thuốc hạ lipid không phải statin để giảm LDL-C và MACE.'},

/* ---------- helpers ---------- */
function num(v){ if(v===null||v===undefined||v==='') return null; var n=parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; }
var PHASES = [
  {id:'p0', lab:'≤1 tuần', lo:0, hi:0.25},
  {id:'p1', lab:'1–4 tuần', lo:0.25, hi:1},
  {id:'p2', lab:'1–3 tháng', lo:1, hi:3},
  {id:'p3', lab:'3–6 tháng', lo:3, hi:6},
  {id:'p4', lab:'6–12 tháng', lo:6, hi:12},
  {id:'p5', lab:'12–24 tháng', lo:12, hi:24},
  {id:'p6', lab:'>24 tháng', lo:24, hi:999}
];
function phaseFromMonths(m){ for(var i=0;i<PHASES.length;i++){ if(m < PHASES[i].hi || i===PHASES.length-1) return PHASES[i].id; } return 'p6'; }
function phaseIdx(id){ for(var i=0;i<PHASES.length;i++) if(PHASES[i].id===id) return i; return 0; }

function egfrCKDEPI(scrMgdl, age, female){
  if(!scrMgdl||!age) return null;
  var k = female?0.7:0.9, a = female?-0.241:-0.302;
  var r = scrMgdl/k;
  var e = 142*Math.pow(Math.min(r,1),a)*Math.pow(Math.max(r,1),-1.200)*Math.pow(0.9938,age)*(female?1.012:1);
  return Math.round(e);
}
function crclCG(scrMgdl, age, wt, female){
  if(!scrMgdl||!age||!wt) return null;
  var c = (140-age)*wt/(72*scrMgdl); if(female) c*=0.85; return Math.round(c);
}

/* derive computed values */
function derive(s){
  var d = {};
  d.age = num(s.age); d.female = s.sex==='f'; d.wt = num(s.wt); d.ht = num(s.ht);
  d.bmi = (d.wt&&d.ht)? Math.round(d.wt/Math.pow(d.ht/100,2)*10)/10 : null;
  d.acs = (s.setting==='stemi'||s.setting==='nstemi'||s.setting==='ua');
  d.mi = (s.setting==='stemi'||s.setting==='nstemi'||(s.hx||[]).indexOf('priorMI')>=0);
  d.phase = s.phase||'p0'; d.pi = phaseIdx(d.phase);
  var cr = num(s.cr); d.scr = cr===null?null:(s.crU==='mg'?cr:cr/88.4);
  d.egfr = egfrCKDEPI(d.scr, d.age, d.female);
  d.crcl = crclCG(d.scr, d.age, d.wt, d.female);
  var ua = num(s.uacr); d.uacr = ua===null?null:(s.uacrU==='mgmmol'?ua*8.84:ua); // mg/g
  d.dialysis = !!s.dialysis;
  d.ckd = d.dialysis || (d.egfr!==null && d.egfr<60) || (d.uacr!==null && d.uacr>=30);
  d.hb = num(s.hb); d.plt = num(s.plt);
  d.dm = s.dm==='t2';
  d.htn = s.htn==='yes';
  d.sbp = num(s.sbp); d.dbp = num(s.dbp);
  d.lvef = num(s.lvef); d.hf = !!s.hfsx || (s.hx||[]).indexOf('hf')>=0;
  d.hx = s.hx||[]; d.feat = s.feat||[]; d.ap = s.ap||[]; d.bl = s.bl||[];
  d.oac = s.oac||'none'; d.oacInd = s.oacInd||'none';
  d.onDAPT = d.ap.length>=2; d.onAny = d.ap.length>0;
  d.potent = d.ap.indexOf('tica')>=0 || d.ap.indexOf('pras')>=0;
  // LDL in mg/dL
  function toMg(v,u){ v=num(v); if(v===null) return null; return u==='mg'?v:Math.round(v*38.67); }
  d.ldl = toMg(s.ldl, s.lipU); d.ldl0 = toMg(s.ldl0, s.lipU);
  var tc = toMg(s.tc, s.lipU), hdl = toMg(s.hdl, s.lipU);
  d.nonhdl = (tc!==null&&hdl!==null)? tc-hdl : null;
  var tg = num(s.tg); d.tg = tg===null?null:(s.lipU==='mg'?tg:Math.round(tg*88.57));
  var lpa = num(s.lpa); d.lpaMg = lpa===null?null:(s.lpaU==='nmol'?lpa/2.1:lpa); d.lpaRaw=lpa;
  d.statin = s.statin||'none'; d.addon = s.addon||[]; d.statinIntol = !!s.statinIntol;
  d.a1c = num(s.a1c); d.dmdrug = s.dmdrug||[];
  d.smoker = s.smoke==='cur';
  // ARC-HBR
  var maj=[], min=[];
  if(d.age!==null && d.age>=75) min.push('Tuổi ≥75');
  if(d.oacInd!=='none' || d.oac!=='none') maj.push('Dự kiến dùng OAC lâu dài');
  if(d.dialysis || (d.egfr!==null && d.egfr<30)) maj.push('CKD nặng/giai đoạn cuối (eGFR <30)');
  else if(d.egfr!==null && d.egfr<60) min.push('CKD trung bình (eGFR 30–59)');
  if(d.hb!==null){ if(d.hb<110) maj.push('Hb <11 g/dL'); else if((d.female && d.hb<120) || (!d.female && d.hb<130)) min.push('Hb 11–12,9 g/dL (nam) / 11–11,9 g/dL (nữ)'); }
  if(d.plt!==null && d.plt<100) maj.push('Giảm tiểu cầu vừa–nặng (<100 G/L)');
  var BLM = {bleed6:'Chảy máu tự phát cần nhập viện/truyền máu trong 6 tháng (hoặc bất kỳ lúc nào nếu tái phát)', diath:'Rối loạn đông máu mạn tính', cirr:'Xơ gan có tăng áp lực tĩnh mạch cửa', cancer:'Ung thư đang hoạt động (trừ ung thư da không hắc tố) trong 12 tháng', ich:'XHN do chấn thương trong 12 tháng / dị dạng động–tĩnh mạch não / đột quỵ thiếu máu vừa–nặng trong 6 tháng', surgnow:'Phẫu thuật lớn không trì hoãn được khi đang DAPT', surgrecent:'Phẫu thuật lớn hoặc chấn thương lớn trong 30 ngày trước PCI'};
  var BLm = {bleed12:'Chảy máu tự phát cần nhập viện/truyền máu trong 12 tháng (không thuộc tiêu chí chính)'};
  d.bl.forEach(function(k){ if(BLM[k]) maj.push(BLM[k]); if(BLm[k]) min.push(BLm[k]); });
  if(d.hx.indexOf('ichx')>=0) maj.push('Tiền sử xuất huyết nội sọ tự phát');
  if(d.hx.indexOf('stroke')>=0 && d.bl.indexOf('ich')<0) min.push('Đột quỵ thiếu máu bất kỳ lúc nào (không thuộc tiêu chí chính)');
  if((s.otherdrug||[]).indexOf('nsaid')>=0) min.push('Dùng NSAID hoặc corticoid đường uống kéo dài');
  d.hbrMaj=maj; d.hbrMin=min; d.hbr = maj.length>=1 || min.length>=2;
  d.giRisk = !!s.gi;
  // Ischaemic risk (ESC 2024 CCS footnote c criteria)
  var anat = {lm:'Đặt stent thân chung', plad:'Đặt stent LAD đoạn gần', last:'Stent động mạch còn lại duy nhất', subopt:'Đặt stent chưa tối ưu', long:'Tổng chiều dài stent >60 mm', bif2:'Chỗ chia đôi đặt 2 stent', cto:'Can thiệp tắc mạn tính hoàn toàn (CTO)', st:'Tiền sử huyết khối stent khi đang dùng chống huyết khối đầy đủ'};
  d.ischAnat = []; d.feat.forEach(function(k){ if(anat[k]) d.ischAnat.push(anat[k]); });
  d.ischClin = []; if(d.dm) d.ischClin.push('Đái tháo đường'); if(d.ckd) d.ischClin.push('Bệnh thận mạn');
  var auto = d.ischAnat.length? 'high' : (d.ischClin.length? 'mod':'low');
  d.ischAuto = auto; d.isch = (s.ischOv && s.ischOv!=='auto')? s.ischOv : auto;
  d.ischHigh = d.isch==='high';
  d.highThrombStent = d.feat.some(function(k){return ['lm','bif2','subopt','st','cyp'].indexOf(k)>=0;});
  // CHA2DS2-VA (V=1: coronary revascularisation)
  var cha = 1, chaParts=['V (bệnh mạch vành/tái thông) +1'];
  if(d.hf || (d.lvef!==null && d.lvef<=40)){cha+=1; chaParts.push('C +1');}
  if(d.htn){cha+=1; chaParts.push('H +1');}
  if(d.age!==null && d.age>=75){cha+=2; chaParts.push('A ≥75 +2');} else if(d.age!==null && d.age>=65){cha+=1; chaParts.push('A 65–74 +1');}
  if(d.dm){cha+=1; chaParts.push('D +1');}
  if(d.hx.indexOf('stroke')>=0 || d.hx.indexOf('tia')>=0){cha+=2; chaParts.push('S +2');}
  d.cha=cha; d.chaParts=chaParts;
  // ACC/AHA 2026 very-high-risk (Figure 10)
  var major=[], hrc=[];
  if(d.acs && d.pi<=4) major.push('HCVC trong 12 tháng');
  if(d.hx.indexOf('priorMI')>=0 || (d.acs && d.mi && d.pi>=5)) major.push('Tiền sử NMCT (ngoài HCVC trên)');
  if(d.hx.indexOf('stroke')>=0) major.push('Tiền sử đột quỵ thiếu máu');
  if(d.hx.indexOf('pad')>=0) major.push('Bệnh động mạch ngoại biên có triệu chứng');
  if(d.age!==null && d.age>=65) hrc.push('Tuổi ≥65');
  hrc.push('Đã can thiệp/phẫu thuật bắc cầu ĐMV');
  if(d.smoker) hrc.push('Đang hút thuốc');
  if(d.dm) hrc.push('Đái tháo đường');
  if(d.hf) hrc.push('Tiền sử suy tim');
  if(d.htn) hrc.push('Tăng huyết áp');
  if(d.ldl!==null && d.ldl>=100 && d.statin==='high' && d.addon.indexOf('eze')>=0) hrc.push('LDL-C ≥100 mg/dL dù statin tối đa + ezetimibe');
  d.vhrMajor=major; d.vhrHrc=hrc;
  d.vhr = major.length>=2 || (major.length>=1 && hrc.length>=2);
  // ESC LDL goal
  d.recurrent = d.hx.indexOf('recur2y')>=0;
  d.escLdlGoal = 55; d.ahaLdlGoal = d.vhr?55:70; d.ahaNonHdlGoal = d.vhr?85:100;
  return d;
}

function I(id, st, why){ return {id:id, st:st||'do', why:why||''}; }

/* ---------- Antithrombotic ---------- */
function antithrombotic(s,d){
  var esc=[], aha=[], warn=[], notes=[];
  var p=d.pi; // 0..6
  var oacNeed = d.oacInd!=='none';
  var acs=d.acs;
  var plan = {esc:[], aha:[]}; // timeline segments
  if(s.stent==='dcb'||s.stent==='bms'){
    notes.push((s.stent==='dcb'?'Nong bóng phủ thuốc (DCB)':'Stent kim loại trần (BMS)')+': các khuyến cáo về thời gian DAPT trong những hướng dẫn được dùng ở đây xây dựng chủ yếu từ PCI đặt DES; không có khuyến cáo riêng cho '+(s.stent==='dcb'?'DCB':'BMS')+'. AHA/ACC 2023 dẫn chiếu Hướng dẫn DAPT 2016 cho BMS. Cần cá thể hoá.');
  }
  if(oacNeed){
    // ---- OAC pathway ----
    if(d.oacInd==='af'){
      esc.push(I('e_af_oac'));
      esc.push(I(d.cha>=2?'e_af_cha2':'e_af_cha1','do','CHA₂DS₂-VA = '+d.cha));
    }
    if(d.oacInd==='mech'){
      esc.push(I('e_af_doacvalve','no','Van cơ học: dùng VKA, không dùng DOAC'));
      notes.push('Van tim cơ học: các khuyến cáo phối hợp OAC + kháng tiểu cầu dưới đây chủ yếu xây dựng trên BN rung nhĩ; với van cơ học, OAC phải là VKA.');
    } else {
      esc.push(I('e_af_doacpref', d.oac==='vka'?'opt':'do', d.oac==='vka'?'Đang dùng VKA':''));
      esc.push(I('e_ccs_doac','do'));
    }
    if(d.oacInd!=='af' && d.oacInd!=='mech') notes.push('Chỉ định OAC ngoài rung nhĩ (vd. huyết khối tĩnh mạch): các hướng dẫn ở đây xây dựng phác đồ phối hợp chủ yếu từ BN rung nhĩ; ESC 2024 CCS và ACC/AHA 2025 HCVC áp dụng cho “BN có chỉ định OAC”.');
    if(acs){
      esc.push(I('e_acs_oac', p<=4?'do':'info', 'Triple ≤1 tuần → OAC + clopidogrel tới 12 tháng'));
      if(d.oacInd==='af') esc.push(I('e_af_acs', p<=4?'do':'info'));
      esc.push(I('e_acs_oac1m', d.ischHigh && p<=1?'opt':(p<=1?'opt':'info')));
      if(d.oacInd==='af') esc.push(I('e_af_acs1m', p<=1?'opt':'info'));
      if(p>=3 && p<=4) esc.push(I('e_acs_oac6','opt'));
      esc.push(I('e_acs_oac12', p>=5?'do':'info', p>=5?'Đã quá 12 tháng: ngừng kháng tiểu cầu':'Kế hoạch: ngừng kháng tiểu cầu ở 12 tháng'));
      plan.esc=[{a:0,b:1,t:'Bộ ba ≤1 tuần (≤1 th nếu NC cao)',k:'tri'},{a:1,b:5,t:'OAC + clopidogrel',k:'dual'},{a:5,b:7,t:'OAC đơn độc',k:'oac'}];
      aha.push(I('a_acs_oac', p<=4?'do':'info'));
      if(p>=5){ aha.push(I('a_ccd_oac1y','opt')); aha.push(I('a_ccd_doacmono','opt')); }
      plan.aha=[{a:0,b:1.6,t:'Bộ ba 1–4 tuần',k:'tri'},{a:1.6,b:5,t:'OAC + P2Y12 (ưu tiên clopidogrel)',k:'dual'},{a:5,b:7,t:'Có thể DOAC đơn độc (CCD 2023, 2b)',k:'oac'}];
    } else {
      esc.push(I('e_ccs_oacasp', p===0?'do':'info'));
      esc.push(I('e_ccs_oacreg', p<=5?'do':'info', d.ischHigh?'Nguy cơ thiếu máu cao → OAC + clopidogrel tới 12 tháng':'Không nguy cơ thiếu máu cao → OAC + clopidogrel tới 6 tháng'));
      if(d.oacInd==='af') esc.push(I('e_af_pci', p<=3?'do':'info'));
      esc.push(I('e_ccs_oacasp1m', p<=1?'opt':'info'));
      if(d.oacInd==='af') esc.push(I('e_af_pci1m', p<=1?'opt':'info'));
      var endDual = d.ischHigh?5:4;
      plan.esc=[{a:0,b:1,t:'Bộ ba ≤1 tuần (≤1 th nếu NC cao)',k:'tri'},{a:1,b:endDual,t:'OAC + clopidogrel',k:'dual'},{a:endDual,b:7,t:'OAC đơn độc',k:'oac'}];
      aha.push(I('a_ccd_oac', p<=3?'do':'info'));
      aha.push(I('a_ccd_oacasp', p<=1?'opt':'info'));
      if(p>=4) aha.push(I('a_ccd_doacmono','opt'));
      if(p>=5) aha.push(I('a_ccd_oac1y','opt'));
      plan.aha=[{a:0,b:1.6,t:'DAPT + DOAC 1–4 tuần',k:'tri'},{a:1.6,b:4,t:'DOAC + clopidogrel tới 6 tháng',k:'dual'},{a:4,b:7,t:'Có thể DOAC đơn độc (2b)',k:'oac'}];
    }
    esc.push(I('e_ccs_oaclife', p>=4?'do':'info'));
    if(d.oacInd==='af') esc.push(I('e_af_no12', p>=5?'no':'info'));
    esc.push(I(acs?'e_acs_notp':'e_ccs_notp','no'));
    if(d.oac==='riva'){ esc.push(I(acs?'e_acs_riva15':'e_ccs_riva15', d.hbr?'opt':'info')); }
    if(d.oac==='dabi'){ esc.push(I(acs?'e_acs_dabi110':'e_ccs_dabi110', d.hbr?'opt':'info')); }
    if(d.oac==='vka'){ esc.push(I(acs?'e_acs_vka':'e_ccs_vka','do')); if(d.oacInd==='af') esc.push(I('e_af_vka','do')); }
    // CKD + AF
    if(d.oacInd==='af' && d.egfr!==null){
      if(d.egfr>=30) esc.push(I('e_ckd_af30','do','eGFR '+d.egfr));
      else if(d.egfr>=15) esc.push(I('e_ckd_af15','do','eGFR '+d.egfr));
      else esc.push(I('e_ckd_af0','do','eGFR '+d.egfr));
    }
    // warnings
    if(d.potent && d.ap.indexOf('asp')>=0) warn.push({lvl:'no', t:'Đang dùng ticagrelor/prasugrel trong phác đồ bộ ba với OAC.', refs:[acs?'e_acs_notp':'e_ccs_notp']});
    else if(d.potent) warn.push({lvl:'opt', t:'Đang phối hợp OAC với ticagrelor/prasugrel: các hướng dẫn ưu tiên clopidogrel khi phối hợp với OAC.', refs:[acs?'e_acs_oac':'e_ccs_oacreg', acs?'a_acs_oac':'a_ccd_oac']});
    if(d.ap.indexOf('asp')>=0 && d.ap.length>=2 && p>=2) warn.push({lvl:'no', t:'Vẫn dùng aspirin trong phác đồ bộ ba khi đã quá 1 tháng sau PCI (ESC: ≤1 tuần, tối đa 1 tháng; ACC/AHA: 1–4 tuần).', refs:[acs?'e_acs_oac':'e_ccs_oacreg', acs?'a_acs_oac':'a_ccd_oac']});
    if(d.onAny && p>=5) warn.push({lvl:'no', t:'Đang dùng kháng tiểu cầu cùng OAC khi đã quá 12 tháng sau PCI.', refs:['e_acs_oac12','e_af_no12']});
    if(!acs && d.onAny && p===4 && !d.ischHigh) warn.push({lvl:'opt', t:'HCVM mạn, không nguy cơ thiếu máu cao: ESC khuyến cáo dừng kháng tiểu cầu sau 6 tháng và dùng OAC đơn độc.', refs:['e_ccs_oacreg']});
    if(d.oac==='none') warn.push({lvl:'no', t:'Có chỉ định OAC nhưng chưa chọn thuốc kháng đông đang dùng.', refs:[]});
  } else {
    // ---- No OAC ----
    if(acs){
      var nste = s.setting!=='stemi';
      esc.push(I('e_acs_asp','do'));
      if(p<=4){
        esc.push(I('e_acs_dapt', d.hbr?'opt':'do', d.hbr?'Có HBR: xem các chiến lược rút ngắn':'Không HBR'));
        esc.push(I('e_acs_tica', 'info')); var noPras = d.hx.indexOf('stroke')>=0||d.hx.indexOf('tia')>=0||d.hx.indexOf('ichx')>=0;
        esc.push(I('e_acs_pras', 'info', noPras?'Tiền sử đột quỵ/TIA/XHN: xem khuyến cáo ACC/AHA (3: Harm)':''));
        esc.push(I('e_acs_praspref', (!noPras && p===0 && !d.potent)?'opt':'info', p>0?'Liên quan lựa chọn thuốc lúc PCI':''));
        esc.push(I('e_acs_clopi','info'));
        if(d.age!==null && d.age>=70) esc.push(I('e_acs_clopiold', d.hbr?'opt':'info'));
        if(p<=1) esc.push(I('e_acs_no30','no','Đang trong 30 ngày đầu'));
        if(d.hbr) esc.push(I('e_acs_hbr1m', p>=1?'opt':'info', 'Có HBR'));
        esc.push(I('e_acs_deesc', p>=2?'opt':'info', p<2?'Chỉ sau 30 ngày đầu':''));
        esc.push(I('e_acs_sapt36', p>=3?(d.ischHigh?'info':'opt'):'info', p<3?'Áp dụng khi đủ 3–6 tháng':(d.ischHigh?'Đang được xếp nguy cơ thiếu máu cao':'')));
        if(d.ckd) esc.push(I('e_ckd_acsdapt', p>=1?'opt':'info','Có CKD'));
      } else {
        esc.push(I('e_ccs_asplife','do'));
        esc.push(I('e_ccs_clopialt','opt'));
        esc.push(I('e_acs_p2y12mono','opt'));
        if(d.ckd){ esc.push(I('e_ckd_sapt','do')); if(d.egfr!==null && d.egfr>30) esc.push(I('e_ckd_clopi','opt')); }
        if(!d.hbr){
          if(d.isch==='high') esc.push(I('e_acs_exthigh','opt'));
          else if(d.isch==='mod') esc.push(I('e_acs_extmod','opt'));
          esc.push(I('e_ccs_ext', d.isch!=='low'?'opt':'info'));
          if(d.isch==='high' && d.ap.indexOf('tica')>=0) esc.push(I('e_ccs_ticamono','opt'));
        }
      }
      // ESC timeline
      if(d.hbr) plan.esc=[{a:0,b:2,t:'DAPT 1 tháng (HBR)',k:'dapt'},{a:2,b:7,t:'Đơn trị kháng tiểu cầu',k:'sapt'}];
      else plan.esc=[{a:0,b:5,t:'DAPT 12 tháng (aspirin + prasugrel/ticagrelor)',k:'dapt'},{a:5,b:7,t:'SAPT lâu dài ± kéo dài nếu nguy cơ thiếu máu cao',k:'sapt'}];
      // AHA
      if(p<=4) aha.push(I('a_acs_asp','do'));
      if(p<=4){
        aha.push(I('a_acs_dapt', d.hbr?'opt':'do', d.hbr?'Có HBR':'Không HBR'));
        aha.push(I(nste?'a_acs_nstept':'a_acs_stemipt','info'));
        aha.push(I(nste?'a_acs_nsteclopi':'a_acs_stemiclopi','info'));
        aha.push(I('a_acs_ticamono', (p>=2 && d.ap.indexOf('tica')>=0)?'opt':'info', p<2?'Sau ≥1 tháng':(d.ap.indexOf('tica')<0?'Áp dụng nếu đang DAPT với ticagrelor':'')));
        aha.push(I('a_acs_deesc', p>=2?'opt':'info'));
        if(d.hbr) aha.push(I('a_acs_hbr', p>=2?'opt':'info','Có HBR'));
      } else {
        aha.push(I('a_ccd_asp','do'));
        if(d.mi && !d.hbr) aha.push(I('a_ccd_extdapt', p===5?'opt':'info', p===6?'Chỉ tới 3 năm':''));
        if(d.isch==='high' && !d.hbr) aha.push(I('a_ccd_riva','opt'));
      }
      if(d.hx.indexOf('stroke')>=0 || d.hx.indexOf('tia')>=0 || d.hx.indexOf('ichx')>=0) aha.push(I('a_acs_prasstroke','no'));
      if(d.hbr) plan.aha=[{a:0,b:2,t:'DAPT 1 tháng (HBR)',k:'dapt'},{a:2,b:7,t:'Đơn trị kháng tiểu cầu',k:'sapt'}];
      else plan.aha=[{a:0,b:5,t:'DAPT ≥12 tháng (hoặc ticagrelor đơn trị sau ≥1 tháng)',k:'dapt'},{a:5,b:7,t:'Aspirin lâu dài; DAPT tới 3 năm nếu NMCT & chảy máu thấp (2b)',k:'sapt'}];
    } else {
      // CCS elective
      if(p<=3){
        esc.push(I('e_ccs_dapt6', (d.hbr && !d.ischHigh)?'opt':'do'));
        if(d.hbr && !d.ischHigh) esc.push(I('e_ccs_hbr13', p>=1?'do':'info','HBR, không nguy cơ thiếu máu cao'));
        if(!d.hbr && !d.ischHigh) esc.push(I('e_ccs_short', p>=1?'opt':'info'));
        if(d.highThrombStent) esc.push(I('e_ccs_potent', p<=3?'opt':'info'));
        if(d.ckd) esc.push(I('e_ckd_ccsdapt', p>=1?'opt':'info','Có CKD'));
      } else {
        esc.push(I('e_ccs_dapt6','info','Đã qua 6 tháng'));
      }
      esc.push(I('e_ccs_asplife', p>=2?'do':'info'));
      esc.push(I('e_ccs_clopialt', p>=2?'opt':'info'));
      if(d.ckd){ esc.push(I('e_ckd_sapt', p>=2?'do':'info')); if(d.egfr!==null && d.egfr>30) esc.push(I('e_ckd_clopi', p>=2?'opt':'info')); }
      if(p>=4 && !d.hbr){ esc.push(I('e_ccs_ext', d.isch!=='low'?'opt':'info')); }
      var dEnd = (d.hbr && !d.ischHigh)?2.5:4;
      plan.esc=[{a:0,b:dEnd,t:(d.hbr&&!d.ischHigh)?'DAPT 1–3 tháng (HBR)':'DAPT aspirin + clopidogrel 6 tháng',k:'dapt'},{a:dEnd,b:7,t:'Aspirin (hoặc clopidogrel) suốt đời',k:'sapt'}];
      aha.push(I('a_ccd_dapt6', p<=3?'do':'info'));
      if(s.stent!=='bms') aha.push(I('a_ccd_p2y12mono', (p>=2 && p<=5)?'opt':'info'));
      aha.push(I('a_ccd_asp', p>=4?'do':'info'));
      if(d.mi && !d.hbr) aha.push(I('a_ccd_extdapt', p>=4&&p<=5?'opt':'info'));
      if(d.isch==='high' && !d.hbr && p>=4) aha.push(I('a_ccd_riva','opt'));
      if(p>=4) aha.push(I('a_ccd_noclopi','no'));
      if(d.hx.indexOf('stroke')>=0 || d.hx.indexOf('tia')>=0 || d.hx.indexOf('ichx')>=0) aha.push(I('a_ccd_prasstroke','no'));
      plan.aha=[{a:0,b:4,t:'DAPT 6 tháng (hoặc P2Y12 đơn trị sau 1–3 tháng, 2a)',k:'dapt'},{a:4,b:7,t:'Aspirin 75–100 mg lâu dài',k:'sapt'}];
    }
    // warnings no-OAC
    if(!d.onAny) warn.push({lvl:'no', t:'Chưa chọn thuốc kháng tiểu cầu đang dùng – BN sau PCI cần ít nhất một thuốc kháng tiểu cầu (trừ khi dùng OAC).', refs:[acs?'e_acs_asp':'e_ccs_asplife']});
    if(d.ap.indexOf('pras')>=0 && (d.hx.indexOf('stroke')>=0||d.hx.indexOf('tia')>=0||d.hx.indexOf('ichx')>=0)) warn.push({lvl:'no', t:'Đang dùng prasugrel ở BN có tiền sử đột quỵ/TIA/XHN.', refs:['a_acs_prasstroke','a_ccd_prasstroke']});
    if(d.ap.indexOf('pras')>=0 && ((d.age!==null&&d.age>=75)||(d.wt!==null&&d.wt<60))) warn.push({lvl:'opt', t:'Prasugrel ở BN ≥75 tuổi hoặc <60 kg: liều duy trì 5 mg/ngày.', refs:['e_acs_pras']});
    if(d.ap.indexOf('tica')>=0 && d.ap.indexOf('pras')>=0) warn.push({lvl:'no', t:'Đang chọn cả ticagrelor và prasugrel – chỉ dùng một thuốc ức chế P2Y12.', refs:[]});
    if(d.ap.indexOf('clopi')>=0 && (d.ap.indexOf('tica')>=0||d.ap.indexOf('pras')>=0)) warn.push({lvl:'no', t:'Đang chọn đồng thời clopidogrel và ticagrelor/prasugrel – chỉ dùng một thuốc ức chế P2Y12.', refs:[]});
    if(acs && p<=1 && d.onDAPT && d.ap.indexOf('clopi')>=0 && s.switched) warn.push({lvl:'no', t:'Xuống thang trong 30 ngày đầu sau HCVC.', refs:['e_acs_no30']});
    if(acs && !d.onDAPT && d.onAny && p<=1) warn.push({lvl:'no', t:'Đang đơn trị kháng tiểu cầu trong tháng đầu sau HCVC (sớm hơn mọi chiến lược rút ngắn được khuyến cáo).', refs:['e_acs_dapt','e_acs_hbr1m','a_acs_hbr']});
    if(acs && d.onDAPT && p>=5 && d.hbr) warn.push({lvl:'no', t:'Vẫn DAPT sau 12 tháng ở BN có HBR – kéo dài thuốc chống huyết khối thứ hai chỉ được khuyến cáo khi KHÔNG có HBR.', refs:['e_acs_exthigh','e_acs_extmod']});
    if(acs && d.onDAPT && p>=5 && !d.hbr) warn.push({lvl:'opt', t:'DAPT sau 12 tháng: chỉ hợp lý khi nguy cơ thiếu máu cao/trung bình và không HBR (ESC IIa/IIb-A); ACC/AHA: tới 3 năm nếu có NMCT và nguy cơ chảy máu thấp (2b-A).', refs:['e_acs_exthigh','a_ccd_extdapt']});
    if(!acs && d.onDAPT && p>=4) warn.push({lvl: d.hbr?'no':'opt', t:'HCVM mạn đã quá 6 tháng mà vẫn DAPT (mặc định ESC/ACC-AHA: 6 tháng).', refs:['e_ccs_dapt6','a_ccd_dapt6','a_ccd_noclopi']});
    if(!acs && d.onDAPT && d.hbr && !d.ischHigh && p>=3) warn.push({lvl:'no', t:'HBR, không nguy cơ thiếu máu cao: ESC khuyến cáo ngừng DAPT sau 1–3 tháng.', refs:['e_ccs_hbr13']});
    if(!acs && d.potent && p>=3 && !d.highThrombStent) warn.push({lvl:'opt', t:'HCVM mạn: DAPT mặc định dùng clopidogrel; prasugrel/ticagrelor chỉ cân nhắc khi đặt stent nguy cơ huyết khối cao, tới 3–6 tháng.', refs:['e_ccs_dapt6','e_ccs_potent']});
  }
  // PPI
  if(d.giRisk){
    if(acs) { esc.push(I('e_acs_ppi','do')); }
    esc.push(I((d.onDAPT||(d.oac!=='none'&&d.onAny))?'e_ccs_ppi':'e_ccs_ppi1', (d.onDAPT||(d.oac!=='none'&&d.onAny))?'do':'opt'));
    aha.push(I('a_acs_ppi','do'));
    if(!acs) aha.push(I('a_ccd_ppi','do'));
    if((s.otherdrug||[]).indexOf('ppi')<0) warn.push({lvl:'opt', t:'Nguy cơ xuất huyết tiêu hoá cao nhưng chưa ghi nhận PPI.', refs:['e_ccs_ppi','a_acs_ppi']});
  }
  if((s.otherdrug||[]).indexOf('nsaid')>=0){ aha.push(I('a_ccd_nsaid','no')); warn.push({lvl:'no', t:'Đang dùng NSAID kéo dài.', refs:['a_ccd_nsaid']}); }
  // DOAC dose check
  var dd = doacDose(s,d); if(dd) { dd.forEach(function(w){warn.push(w);}); }
  return {esc:esc, aha:aha, warn:warn, notes:notes, plan:plan};
}

function doacDose(s,d){
  var out=[]; if(d.oac==='none'||d.oac==='vka') return out;
  var red = s.oacDose==='red';
  var crit=false, why=[];
  if(d.oac==='apix'){
    var n=0; if(d.age>=80){n++;why.push('≥80 tuổi');} if(d.wt!==null&&d.wt<=60){n++;why.push('≤60 kg');} if(d.scr!==null&&d.scr*88.4>=133){n++;why.push('creatinine ≥133 µmol/L');}
    crit = n>=2;
    if(red && !crit) out.push({lvl:'no', t:'Apixaban 2,5 mg × 2 nhưng chưa đủ 2/3 tiêu chí giảm liều ('+(why.join(', ')||'không có tiêu chí nào')+').', refs:['e_af_lowdose']});

  return {boxes:boxes, texts:texts, marks:marks, keeps:keeps, H:root.scrollHeight};
}
function pdfBreaks(L){
  var PH=PDFK.H-PDFK.MT-PDFK.MB;
  var iv=L.texts.map(function(t){return [t.y, t.y+t.h, t.hd];}).sort(function(a,b){return a[0]-b[0];});
  var lines=[]; iv.forEach(function(v){ var l=lines[lines.length-1]; if(l && v[0] < l[1]-1){ l[1]=Math.max(l[1],v[1]); l[2]=l[2]&&v[2]; } else lines.push([v[0],v[1],v[2]]); });
  var pages=[], s=0;
  while(true){
    var lim=s+PH; if(L.H<=lim || !lines.length || lines[lines.length-1][1]<=lim){ pages.push([s, Math.max(L.H,s+1)]); break; }
    var j=-1; for(var i=0;i<lines.length;i++){ if(lines[i][1]<=lim) j=i; else break; }
    while(j>0 && lines[j][2] && lines[j][0]>s) j--; // không để tiêu đề cuối trang
    var e = (j>=0 && lines[j][1]>s+20) ? Math.min(lim, lines[j][1] + ((lines[j+1]?lines[j+1][0]:lim) - lines[j][1])/2) : lim;
    L.keeps.forEach(function(k){ if(k[0]<e && k[1]>e && k[0]>s+40 && k[1]-k[0]<PH*0.5) e=Math.min(e,k[0]-2); });
    // tiêu đề ngay trước điểm ngắt → đẩy xuống trang sau
    for(var q=lines.length-1;q>=0;q--){ if(lines[q][1]<=e){ if(lines[q][2] && lines[q][0]>s+40) e=lines[q][0]-2; break; } }
    pages.push([s,e]); s=e;
    lines=lines.filter(function(l){return l[0]>=s-0.5;});
  }
  return pages;
}
function pdfDrawPage(L, pg, idx, total, foot){
  var c=document.createElement('canvas'), K=PDFK; c.width=K.W*K.SC; c.height=K.H*K.SC;
  var x=c.getContext('2d'); x.scale(K.SC,K.SC); x.fillStyle='#fff'; x.fillRect(0,0,K.W,K.H);
  x.save(); x.beginPath(); x.rect(0, K.MT-1, K.W, pg[1]-pg[0]+2); x.clip(); x.translate(K.ML, K.MT-pg[0]);
  L.boxes.forEach(function(b){
    if(b.y>pg[1] || b.y+b.h<pg[0]) return;
    if(b.bg){ x.fillStyle=b.bg; if(b.rad && x.roundRect){ x.beginPath(); x.roundRect(b.x,b.y,b.w,b.h,b.rad); x.fill(); } else x.fillRect(b.x,b.y,b.w,b.h); }
    var uni = b.sides.length===4 && b.sides.every(function(s){return s.w===b.sides[0].w && s.c===b.sides[0].c;});
    if(uni && b.rad && x.roundRect){ var s0=b.sides[0]; x.strokeStyle=s0.c; x.lineWidth=s0.w; x.setLineDash(s0.d?[3,2]:[]); x.beginPath(); x.roundRect(b.x+s0.w/2,b.y+s0.w/2,b.w-s0.w,b.h-s0.w,b.rad); x.stroke(); return; }
    b.sides.forEach(function(s){ x.fillStyle=s.c;
      if(!s.d){ if(s.s==='Top') x.fillRect(b.x,b.y,b.w,s.w); else if(s.s==='Bottom') x.fillRect(b.x,b.y+b.h-s.w,b.w,s.w); else if(s.s==='Left') x.fillRect(b.x,b.y,s.w,b.h); else x.fillRect(b.x+b.w-s.w,b.y,s.w,b.h); }
      else { x.strokeStyle=s.c; x.lineWidth=s.w; x.setLineDash([3,2]); x.beginPath(); var yy=s.s==='Top'?b.y+s.w/2:b.y+b.h-s.w/2; x.moveTo(b.x,yy); x.lineTo(b.x+b.w,yy); x.stroke(); x.setLineDash([]); }
    });
  });
  L.marks.forEach(function(m){ if(m.y<pg[0]||m.y>pg[1]) return; x.fillStyle=m.c; x.beginPath(); x.arc(m.x,m.y,1.8,0,7); x.fill(); });
  x.textBaseline='alphabetic'; var lastF='';
  L.texts.forEach(function(t){
    if(t.y+t.h/2<pg[0] || t.y+t.h/2>pg[1]) return;
    if(t.f!==lastF){ x.font=t.f; lastF=t.f; }
    var mm=x.measureText(t.t), a=mm.fontBoundingBoxAscent||mm.actualBoundingBoxAscent||t.h*0.75, d=mm.fontBoundingBoxDescent||t.h*0.22;
    x.fillStyle=t.c; x.fillText(t.t, t.x, t.y+(t.h-(a+d))/2+a);
  });
  x.restore();
  x.font='400 8pt "Be Vietnam Pro",Arial,sans-serif'; x.fillStyle='#777'; x.textBaseline='alphabetic';
  x.fillText(foot, K.ML, K.H-K.MB/2+4); var pn='Trang '+(idx+1)+'/'+total; x.fillText(pn, K.W-K.MR-x.measureText(pn).width, K.H-K.MB/2+4);
  return c;
}
function pdfBytes(jpegs){ // jpegs: [{data:Uint8Array, w, h}] → PDF A4
  var enc=new TextEncoder(), parts=[], off=0, xref=[];
  function put(s){ var b=typeof s==='string'?enc.encode(s):s; parts.push(b); off+=b.length; }
  function obj(n){ xref[n]=off; put(n+' 0 obj\n'); }
  var N=jpegs.length, pw=595.28, ph=841.89;
  put('%PDF-1.4\n');
  obj(1); put('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  var kids=[]; for(var i=0;i<N;i++) kids.push((3+i*3)+' 0 R');
  obj(2); put('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>\nendobj\n');
  jpegs.forEach(function(j,i){
    var p=3+i*3, im=p+1, ct=p+2, cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    obj(p); put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>\nendobj\n');
    obj(im); put('<< /Type /XObject /Subtype /Image /Width '+j.w+' /Height '+j.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.data.length+' >>\nstream\n'); put(j.data); put('\nendstream\nendobj\n');
    obj(ct); put('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
  });
  var n=3+N*3, xo=off, s='xref\n0 '+n+'\n0000000000 65535 f \n';
  for(var k=1;k<n;k++) s+=('0000000000'+xref[k]).slice(-10)+' 00000 n \n';
  put(s+'trailer\n<< /Size '+n+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF\n');
  var out=new Uint8Array(off), o=0; parts.forEach(function(b){ out.set(b,o); o+=b.length; }); return out;
}
function canvasJpeg(c){ var u=c.toDataURL('image/jpeg',0.92), b=atob(u.split(',')[1]), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return {data:a, w:c.width, h:c.height, url:u}; }
function buildPdf(){
  var host=document.getElementById('pdfsrc');
  host.innerHTML=reportBody();
  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  return fontsReady.then(function(){
    var root=host.firstElementChild, L=pdfCollect(root), pgs=pdfBreaks(L);
    var foot='Quản lý BN sau PCI'+(S.pname?' · '+S.pname:'')+(S.pid?' · Mã BN '+S.pid:'')+' · '+fmtDate(Date.now());
    var jp=pgs.map(function(pg,i){ return canvasJpeg(pdfDrawPage(L,pg,i,pgs.length,foot)); });
    host.innerHTML='';
    return {pages:jp, bytes:pdfBytes(jp)};
  });
}

var PV=null;
function pdfName(){ return 'Ket-qua-sau-PCI-'+(S.pid?String(S.pid).replace(/[^A-Za-z0-9_-]/g,'')+'-':'')+fmtDate(Date.now()).replace(/\//g,'-')+'.pdf'; }
function doPrint(){
  var pv=document.getElementById('pv'), body=document.getElementById('pvbody'), sv=document.getElementById('pvsave');
  PV=null; sv.disabled=true; document.getElementById('pvinfo').textContent=''; body.innerHTML='<p class="pvmsg">Đang tạo bản PDF…</p>'; pv.hidden=false;
  setTimeout(function(){
    buildPdf().then(function(r){
      PV=r; sv.disabled=false;
      document.getElementById('pvinfo').textContent='· '+r.pages.length+' trang A4';
      body.innerHTML=r.pages.map(function(p,i){ return '<img alt="Trang '+(i+1)+'" src="'+p.url+'">'; }).join('');
    }).catch(function(err){ body.innerHTML='<p class="pvmsg">Không tạo được PDF: '+esc(String(err&&err.message||err))+'</p>'; });
  }, 30);
}
function savePdf(){
  if(!PV) return;
  getDL().then(function(dl){
    if(dl){
      dl.save({filename:pdfName(), data:new Blob([PV.bytes],{type:'application/pdf'})}).then(function(){ toast('Đã lưu file PDF'); document.getElementById('pv').hidden=true; }, function(err){ if(err && err.code==='declined') return; toast('Không lưu được PDF trong khung này'); });
    } else {
      try{ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([PV.bytes],{type:'application/pdf'})); a.download=pdfName(); document.body.appendChild(a); a.click(); a.remove(); toast('Đã tải file PDF'); }catch(e){ toast('Không lưu được PDF trong khung này'); }
    }
  });
}
document.getElementById('pvclose').addEventListener('click', function(){ document.getElementById('pv').hidden=true; });
document.getElementById('pvsave').addEventListener('click', savePdf);
document.addEventListener('keydown', function(e){ if(e.key==='Escape') document.getElementById('pv').hidden=true; });
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); setTimeout(function(){el.classList.remove('show');},1800); }

/* ---------- events ---------- */
function full(){ var d=derive(S); buildRail(d); render(); }
document.getElementById('rail').addEventListener('click', function(e){
  var b=e.target.closest('.chip'); if(!b) return;
  var k=b.dataset.k, t=b.dataset.t, v=b.dataset.v;
  S.demo=false;
  if(t==='one'){ S[k]=v; if(k==='phase') S.pciDate=''; }
  else if(t==='multi'){ var a=(S[k]||[]).slice(); var i=a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v); S[k]=a; }
  else if(t==='bool'){ S[k]=!S[k]; }
  var rail=document.getElementById('rail'), y=rail.scrollTop, wy=window.scrollY;
  buildRail(derive(S)); rail.scrollTop=y; window.scrollTo(0,wy);
  var again=rail.querySelector('.chip[data-k="'+k+'"]'+(v?'[data-v="'+v+'"]':'')); if(again) again.focus({preventScroll:true});
  render();
});
document.getElementById('rail').addEventListener('input', function(e){
  var el=e.target; if(!el.dataset || !el.dataset.k) return;
  S[el.dataset.k]=el.value; S.demo=false;
  if(el.dataset.k==='pciDate'){ var m=monthsSince(el.value); if(m!==null){ S.phase=phaseFromMonths(m); var y=document.getElementById('rail').scrollTop; buildRail(derive(S)); document.getElementById('rail').scrollTop=y; } }
  render();
});
document.getElementById('rail').addEventListener('change', function(e){
  var el=e.target; if(el.tagName==='SELECT' && el.dataset.k){ S[el.dataset.k]=el.value; render(); }
});
document.getElementById('rail').addEventListener('toggle', function(e){
  var dt=e.target; if(!dt.dataset || !dt.dataset.sec) return;
  try{ var o=JSON.parse(localStorage.getItem(KEY+'-open')||'{}'); o[dt.dataset.sec]=dt.open; localStorage.setItem(KEY+'-open', JSON.stringify(o)); }catch(err){}
}, true);
document.getElementById('board').addEventListener('click', function(e){
  var b=e.target.closest('.tab'); if(!b) return; UI.tab=b.dataset.tab; render();
  var nt=document.getElementById('tab_'+UI.tab); if(nt) nt.focus();
});
document.getElementById('reset').addEventListener('click', function(){ S=JSON.parse(JSON.stringify(EMPTY)); full(); toast('Đã làm mới dữ liệu'); });
document.getElementById('print').addEventListener('click', doPrint);
full();
})();
